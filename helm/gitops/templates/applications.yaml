{{- $addons := dict "aws-load-balancer-controller" (dict "repo" "https://aws.github.io/eks-charts" "version" "3.5.0" "ns" "kube-system") "metrics-server" (dict "repo" "https://kubernetes-sigs.github.io/metrics-server/" "version" "3.14.0" "ns" "kube-system") "kube-prometheus-stack" (dict "repo" "https://prometheus-community.github.io/helm-charts" "version" "91.8.2" "ns" "observability") "opentelemetry-collector" (dict "repo" "https://open-telemetry.github.io/opentelemetry-helm-charts" "version" "0.175.0" "ns" "observability") "loki" (dict "repo" "https://grafana.github.io/helm-charts" "version" "7.3.0" "ns" "observability") "sealed-secrets" (dict "repo" "https://bitnami.github.io/sealed-secrets" "version" "2.20.0" "ns" "kube-system") "argo-rollouts" (dict "repo" "https://argoproj.github.io/argo-helm" "version" "2.43.5" "ns" "kube-system") "traefik" (dict "repo" "https://traefik.github.io/charts" "version" "42.1.2" "ns" "traefik" "skipCrds" true "namespaceLabels" (dict "elbv2.k8s.aws/pod-readiness-gate-inject" "enabled")) }}
{{- range $purpose, $target := .Values.targets }}
{{- if $.Values.headlamp.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charlie-{{ $purpose }}-headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: charlie-addons-{{ $purpose }}
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: helm/charts/headlamp-team
    helm:
      releaseName: headlamp
      valueFiles:
        - ../../../clusters/aws-dev-{{ $purpose }}/values/headlamp-team.yaml
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: headlamp
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charlie-{{ $purpose }}-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: charlie-addons-{{ $purpose }}
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: helm/charts/cluster-baseline
    helm:
      releaseName: baseline
      valueFiles:
        - ../../../clusters/aws-dev-{{ $purpose }}/values/baseline.yaml
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: {{ if eq $purpose "management" }}charlie-platform{{ else }}charlie-apps{{ end }}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
{{- if eq $purpose "management" }}
# HopCharlie platform (API, gateway, console, PostgreSQL) after the addons, so
# the gp3 StorageClass and the load balancer controller exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charlie-management-hopcharlie-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: charlie-addons-management
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: helm/charts/hopcharlie-platform
    helm:
      releaseName: hopcharlie-platform
      valueFiles:
        - ../../../clusters/aws-dev-management/values/hopcharlie-platform.yaml
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: charlie-platform
  # The API server fills defaults (apiVersion, kind, volumeMode, status) into
  # the PostgreSQL volumeClaimTemplates, which are immutable; without this
  # Argo CD reports the StatefulSet OutOfSync forever and keeps re-syncing.
  ignoreDifferences:
    - {group: apps, kind: StatefulSet, name: hopcharlie-postgres, jsonPointers: [/spec/volumeClaimTemplates]}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
---
# Apps the platform deploys from GitHub (ADR 0023): an AppProject and an
# ApplicationSet that turn each apps/<app>/<env>.yaml of the gitops repository
# into an Application with helm/charts/hopcharlie-app. Environment eks is the
# workload cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charlie-management-hopcharlie-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: charlie-hopcharlie-apps
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: helm/charts/hopcharlie-apps
    helm:
      releaseName: hopcharlie-apps
      valueFiles:
        - ../../../clusters/aws-dev-management/values/hopcharlie-apps.yaml
      parameters:
        - {name: chart.repoURL, value: {{ $.Values.repoURL | quote }}}
        - {name: chart.revision, value: {{ $.Values.revision | quote }}}
        - {name: environments.eks.cluster.server, value: {{ (required "targets.workload is required for the app ApplicationSet" $.Values.targets.workload).endpoint | quote }}}
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: argocd
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
{{- end }}
{{- range $name := index $.Values.addons $purpose }}
{{- if and $.Values.observability.enabled (eq $name "opentelemetry-collector") }}
{{- fail "Do not enable legacy opentelemetry-collector alongside observability agents" }}
{{- end }}
{{- $addon := index $addons $name }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charlie-{{ $purpose }}-{{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: charlie-addons-{{ $purpose }}
  sources:
    - repoURL: {{ $addon.repo | quote }}
      chart: {{ $name }}
      targetRevision: {{ $addon.version | quote }}
      helm:
        releaseName: {{ if eq $name "kube-prometheus-stack" }}monitoring{{ else }}{{ $name }}{{ end }}
        {{- if $addon.skipCrds }}
        # The chart's CRDs are for providers this cluster does not turn on.
        skipCrds: true
        {{- end }}
        valueFiles:
          - $values/clusters/aws-dev-{{ $purpose }}/values/{{ if and (eq $purpose "workload") (eq $name "kube-prometheus-stack") (dig "automatic" "enabled" false $.Values.observability) }}cnpg-prometheus{{ else }}{{ $name }}{{ end }}.yaml
        {{- if eq $name "aws-load-balancer-controller" }}
        parameters:
          - {name: clusterName, value: {{ $target.name | quote }}}
          - {name: region, value: {{ $target.region | quote }}}
          - {name: vpcId, value: {{ $target.vpc_id | quote }}}
        {{- end }}
    - repoURL: {{ $.Values.repoURL | quote }}
      targetRevision: {{ $.Values.revision | quote }}
      ref: values
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: {{ $addon.ns }}
  {{- if eq $name "aws-load-balancer-controller" }}
  # The chart generates a new webhook certificate on every render. Keep the live one so a
  # re-sync does not leave running controllers serving a certificate the webhooks reject.
  ignoreDifferences:
    - {group: "", kind: Secret, name: aws-load-balancer-tls, namespace: kube-system, jsonPointers: [/data]}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration, name: aws-load-balancer-webhook, jqPathExpressions: [".webhooks[].clientConfig.caBundle"]}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration, name: aws-load-balancer-webhook, jqPathExpressions: [".webhooks[].clientConfig.caBundle"]}
  {{- end }}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true{{ if eq $name "aws-load-balancer-controller" }}, RespectIgnoreDifferences=true{{ end }}]
    {{- with $addon.namespaceLabels }}
    managedNamespaceMetadata:
      labels: {{ toJson . }}
    {{- end }}
---
{{- end }}
{{- end }}
