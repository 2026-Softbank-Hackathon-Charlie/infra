{{- range $purpose, $target := .Values.targets }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: charlie-addons-{{ $purpose }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
    - {{ $.Values.repoURL | quote }}
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://grafana.github.io/helm-charts
    - https://bitnami.github.io/sealed-secrets
    - https://argoproj.github.io/argo-helm
    - https://traefik.github.io/charts
  destinations:
    {{- if $.Values.headlamp.enabled }}
    - server: {{ $target.endpoint | quote }}
      namespace: headlamp
    {{- end }}
    - server: {{ $target.endpoint | quote }}
      namespace: kube-system
    - server: {{ $target.endpoint | quote }}
      namespace: observability
    {{- if eq $purpose "workload" }}
    - server: {{ $target.endpoint | quote }}
      namespace: cnpg-system
    - server: {{ $target.endpoint | quote }}
      namespace: cert-manager
    # The shared app entry (ADR 0058).
    - server: {{ $target.endpoint | quote }}
      namespace: traefik
    {{- end }}
    - server: {{ $target.endpoint | quote }}
      namespace: {{ if eq $purpose "management" }}charlie-platform{{ else }}charlie-apps{{ end }}
    {{- if and (eq $purpose "management") (( $.Values.onpremRegistration | default dict).enabled) }}
    - server: {{ $target.endpoint | quote }}
      namespace: argocd
    - server: {{ $target.endpoint | quote }}
      namespace: hopcharlie-db-network
    {{- end }}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: apiregistration.k8s.io, kind: APIService}
    - {group: networking.k8s.io, kind: IngressClass}
    - {group: elbv2.k8s.aws, kind: IngressClassParams}
    {{- if and (eq $purpose "management") (( $.Values.onpremRegistration | default dict).enabled) }}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
    - {group: tailscale.com, kind: ProxyClass}
    {{- end }}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
{{- if eq $purpose "management" }}
---
# The platform's app ApplicationSet (helm/charts/hopcharlie-apps, ADR 0023):
# only its AppProject, ApplicationSet and the platform's Role in argocd, and
# the admission policy that limits that Role.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: charlie-hopcharlie-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
    - {{ $.Values.repoURL | quote }}
  destinations:
    - server: {{ $target.endpoint | quote }}
      namespace: argocd
  clusterResourceWhitelist:
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: AppProject}
    - {group: argoproj.io, kind: ApplicationSet}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
{{- end }}
---
{{- end }}
