{{- include "cnpg-poc.validate" . }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cnpg-gp3-retain
  labels:
    {{- include "cnpg-poc.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cnpg-poc-budget
  namespace: charlie-db
spec:
  hard:
    {{- toYaml .Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cnpg-poc-defaults
  namespace: charlie-db
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
