apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-poc-source
  namespace: charlie-db
spec:
  configuration:
    destinationPath: {{ printf "s3://%s/source/" .Values.backup.bucketName | quote }}
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  instanceSidecarConfiguration:
    env:
      - name: AWS_REGION
        value: {{ .Values.backup.region | quote }}
      - name: AWS_DEFAULT_REGION
        value: {{ .Values.backup.region | quote }}
    resources:
      {{- toYaml .Values.backupResources | nindent 6 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-poc-daily
  namespace: charlie-db
spec:
  cluster:
    name: postgres-poc
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: {{ .Values.backup.schedule | quote }}
  immediate: false
  suspend: false
  backupOwnerReference: none
