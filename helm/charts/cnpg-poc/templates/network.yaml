apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-poc-default-deny
  namespace: charlie-db
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-poc-dns
  namespace: charlie-db
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.dnsExtraCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-poc-database
  namespace: charlie-db
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [postgres-poc, postgres-poc-restore]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [charlie-apps, charlie-db]
          podSelector:
            matchLabels:
              charlie.dev/cnpg-client: "true"
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [postgres-poc, postgres-poc-restore]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
              app.kubernetes.io/instance: {{ .Values.operatorInstance }}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [postgres-poc, postgres-poc-restore]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    # The Kubernetes API and object storage use HTTPS; this does not publish DB.
    - ports:
        - {protocol: TCP, port: 443}
    # Only the selected cloud's workload-identity metadata endpoint is allowed.
    {{- range .Values.metadataEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-poc-local-clients
  namespace: charlie-db
spec:
  podSelector:
    matchLabels:
      charlie.dev/cnpg-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [postgres-poc, postgres-poc-restore]
      ports:
        - {protocol: TCP, port: 5432}
