{{- /*
Argo CD renders template and templatePatch as Go templates with the gitops
file's keys and the file's path as parameters (goTemplate), so its own
expressions are quoted here as {{`...`}}.

The Application has two sources: the chart, and the gitops repository as
the ref $gitops. The chart reads the gitops file at the revision Argo CD
tracks, so status.sync.revisions holds the gitops commit that is deployed,
and refreshing the Application picks up a new commit. The ApplicationSet
only creates and deletes Applications.
*/}}
{{- $envs := .Values.environments }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    # Deleting the Application that draws this chart (or a cascade from a root)
    # must not delete the ApplicationSet: that would delete every generated
    # Application, and their finalizer deletes each app's namespace and database.
    # preserveResourcesOnDeletion does not help here: the template below names
    # the finalizer, and Argo CD only skips adding one when the template has none.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.gitops.repoURL | quote }}
        revision: {{ .Values.gitops.revision | quote }}
        files:
          {{- range $env, $_ := $envs }}
          - path: {{ printf "apps/*/%s.yaml" $env | quote }}
          {{- end }}
        {{- with .Values.gitops.requeueAfterSeconds }}
        requeueAfterSeconds: {{ . }}
        {{- end }}
  template:
    metadata:
      # The namespace is the instance: unique per file, unlike app.
      name: '{{`{{ .namespace }}-{{ .env }}`}}'
      labels:
        hopcharlie.dev/app: '{{`{{ .app }}`}}'
        hopcharlie.dev/instance: '{{`{{ .namespace }}`}}'
        hopcharlie.dev/env: '{{`{{ .env }}`}}'
      # Deleting the Application (its file is gone) deletes what it created.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.name }}
      sources: [] # per environment, in templatePatch
      destination:
        namespace: '{{`{{ .namespace }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Without retry, a failed automated sync waits for the next commit.
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        # No CreateNamespace: the chart renders the namespace, so deleting
        # the Application deletes it too.
        # Syncs leave the ignored fields below as they are, not only the diff.
        syncOptions:
          - RespectIgnoreDifferences=true
      # A migration owns replica and certificates (ADR 0050). Legacy clusters
      # also keep operator-managed externalClusters. Clusters with explicit
      # members (label hopcharlie.dev/db-topology-members, "2" or "3") declare
      # every member in Git: ignoring that list would prevent adding the third
      # member, or dropping a removed one (platform ADR 0064). The label is
      # read on both sides, so a "3" to "2" change applies the new list.
      # replica stays ignored during demotion/promotion.
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          jqPathExpressions:
            - .spec.replica
            - select(.metadata.labels["hopcharlie.dev/db-topology-members"] == null) | .spec.externalClusters
            - .spec.certificates
            # Meaningful only at creation, like replica: an onboarded app's
            # database is born a replica of its source and the chart draws
            # initdb after the cutover (infra ADR 0082).
            - .spec.bootstrap
        # The migration engine starts an onboarded app's Deployments at the
        # cutover (platform ADR 0042); while the chart labels them cold,
        # selfHeal must not put replicas 0 back (infra ADR 0082).
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - select(.metadata.labels["hopcharlie.dev/onboarding-cold"] == "true") | .spec.replicas
        # The Tailscale operator points a database egress Service (ADR 0063) at
        # its proxy by rewriting externalName; selfHeal must not put the
        # chart's placeholder back. Only ExternalName Services with a tailnet
        # target match, so no other Service field or Service is ignored.
        - group: ""
          kind: Service
          jqPathExpressions:
            - select(.spec.type == "ExternalName" and .metadata.annotations["tailscale.com/tailnet-fqdn"] != null) | .spec.externalName
  templatePatch: |
    spec:
    {{- range $env, $e := $envs }}
    {{`{{- if eq .env `}}{{ $env | quote }}{{` }}`}}
      destination:
        {{- toYaml $e.cluster | nindent 8 }}
      sources:
        - repoURL: {{ $.Values.chart.repoURL | quote }}
          targetRevision: {{ $.Values.chart.revision | quote }}
          path: {{ $.Values.chart.path | quote }}
          helm:
            releaseName: '{{`{{ .namespace }}`}}'
            valueFiles:
              - '{{`$gitops/{{ .path.path }}/{{ .path.filename }}`}}'
            valuesObject:
              {{- $profile := deepCopy ($e.profile | default dict) }}
              {{- if not (dig "observability" "enabled" false $profile) }}
              {{- $_ := unset $profile "observability" }}
              {{- end }}
              profile: {{ $profile | toJson }}
        - repoURL: {{ $.Values.gitops.repoURL | quote }}
          targetRevision: {{ $.Values.gitops.revision | quote }}
          ref: gitops
    {{`{{- end }}`}}
    {{- end }}
