{{- if .Values.webEnabled }}
{{- $issuer := required "oidc.issuerURL is required" .Values.oidc.issuerURL }}
{{- $client := required "oidc.clientID is required" .Values.oidc.clientID }}
{{- if not .Values.clusters }}{{ fail "clusters must contain actual EKS endpoints and CAs" }}{{ end }}
{{- /* The kubeconfig carries the OIDC client secret, so prepare-headlamp.py
       installs it as a Secret; the chart only mounts it. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: headlamp-team}
  template:
    metadata:
      labels: {app.kubernetes.io/name: headlamp-team}
      annotations:
        checksum/public-config: {{ toJson (dict "oidc" .Values.oidc "clusters" .Values.clusters) | sha256sum }}
        {{- if .Values.googleAuth.enabled }}
        checksum/google-auth-plugin: {{ include (print $.Template.BasePath "/google-auth-plugin.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101  # lets the non-root container read the 0440 kubeconfig Secret
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headlamp
          image: {{ .Values.image | quote }}
          args:
            - -kubeconfig=/etc/headlamp/clusters/config
            - -oidc-use-cookie=true
            - -oidc-use-token-broadcast=true
          env:
            - {name: HEADLAMP_CONFIG_OIDC_CLIENT_ID, value: {{ $client | quote }}}
            - {name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL, value: {{ $issuer | quote }}}
            - {name: HEADLAMP_CONFIG_OIDC_SCOPES, value: "openid,profile,email"}
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: client-secret
          ports: [{name: http, containerPort: 4466}]
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: clusters, mountPath: /etc/headlamp/clusters, readOnly: true}
            {{- if .Values.googleAuth.enabled }}
            - {name: google-auth-plugin, mountPath: /headlamp/static-plugins/hopcharlie-google-login, readOnly: true}
            {{- end }}
      volumes:
        - name: clusters
          secret:
            secretName: {{ required "clustersSecret is required" .Values.clustersSecret | quote }}
            defaultMode: 0440
        {{- if .Values.googleAuth.enabled }}
        - name: google-auth-plugin
          configMap:
            name: headlamp-google-auth-plugin
            defaultMode: 0444
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: headlamp-team}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .Values.albGroup | quote }}
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: headlamp, port: {number: 80}}
{{- end }}
