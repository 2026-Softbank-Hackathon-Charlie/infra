{{- if ne .Release.Namespace "minio-gce" }}
{{- fail "GCE storage must be installed in minio-gce" }}
{{- end }}
{{- if not (regexMatch "^525091405886\\.dkr\\.ecr\\.ap-northeast-2\\.amazonaws\\.com/hopcharlie/apps/gce-storage/minio@sha256:[a-f0-9]{64}$" .Values.image) }}
{{- fail "an exact verified GCE MinIO repository digest is required" }}
{{- end }}
{{- if not (regexMatch "^100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.[0-9]{1,3}\\.[0-9]{1,3}$" .Values.tailIP) }}
{{- fail "a Tailscale IPv4 host binding is required" }}
{{- end }}
{{- if not (regexMatch "^gce-ready-[a-f0-9]{10}$" .Values.owner) }}
{{- fail "an explicit GCE readiness owner is required" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    charlie.dev/gce-ready-run: {{ .Values.owner | quote }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    charlie.dev/gce-ready-run: {{ .Values.owner | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          args: [server, /data, --address, ':9000', --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: minio-root, key: root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: minio-root, key: root-password}}
            - {name: MINIO_REGION_NAME, value: us-east-1}
            - {name: MINIO_BROWSER, value: 'off'}
            - {name: MINIO_UPDATE, value: 'off'}
          ports:
            - name: s3
              containerPort: 9000
              hostPort: 9000
              hostIP: {{ .Values.tailIP | quote }}
          startupProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-isolation
spec:
  podSelector: {matchLabels: {app: minio}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {charlie.dev/workload-target: onprem-gce}
        - ipBlock: {cidr: 100.64.0.0/10}
      ports: [{protocol: TCP, port: 9000}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
