{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": {{ .Values.namespace | quote }},
    "labels": {
      "charlie.dev/workload-target": "onprem-gce",
      "pod-security.kubernetes.io/enforce": "restricted",
      "pod-security.kubernetes.io/audit": "restricted",
      "pod-security.kubernetes.io/warn": "restricted"
    },
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-1"
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "gce-public-check",
    "namespace": {{ .Values.namespace | quote }}
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "gce-public-check"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "gce-public-check"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10000,
          "runAsGroup": 10000,
          "fsGroup": 10000,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "http",
            "image": "docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e",
            "command": [
              "sh",
              "-ec",
              "mkdir -p /tmp/www; echo gce-readiness-ok >/tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www"
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 8080
              },
              "periodSeconds": 3
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "gce-public-check",
    "namespace": {{ .Values.namespace | quote }}
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "gce-public-check"
    },
    "ports": [
      {
        "port": 80,
        "targetPort": 8080
      }
    ]
  }
}
