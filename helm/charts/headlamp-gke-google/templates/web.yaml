{{- $image := required "proxy.image requires the verified upstream v7.15.5 digest" .Values.proxy.image }}
{{- if ne $image "quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916" }}
{{- fail "proxy.image must pin the verified upstream v7.15.5 image by sha256 digest" }}
{{- end }}
{{- $trusted := .Values.proxy.trustedProxyCIDRs }}
{{- if not $trusted }}{{ fail "proxy.trustedProxyCIDRs must contain the observed ALB source ranges" }}{{ end }}
{{- range $trusted }}
{{- if not (regexMatch `^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$` .) }}{{ fail "trusted proxy CIDR must be a restricted IPv4 CIDR with a prefix between 1 and 32" }}{{ end }}
{{- end }}
{{- $secret := required "oauth.existingSecret is required" .Values.oauth.existingSecret }}
{{- $clusters := required "clustersSecret is required" .Values.clustersSecret }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-gke-google
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-gke-google
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: headlamp-gke-google}
  template:
    metadata:
      labels: {app.kubernetes.io/name: headlamp-gke-google}
    spec:
      serviceAccountName: headlamp-gke-google
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headlamp
          image: {{ .Values.headlampImage | quote }}
          args:
            - -kubeconfig=/etc/headlamp/clusters/config
            - -in-cluster=false
            - -base-url=/gke
            - -listen-addr=127.0.0.1
            - -proxy-auth=true
            - -proxy-auth-token-header=X-Forwarded-Access-Token
            - -proxy-auth-group-header=X-Forwarded-Groups
          readinessProbe:
            exec:
              command: [/bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:4466/gke/]
          livenessProbe:
            exec:
              command: [/bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:4466/gke/]
            initialDelaySeconds: 10
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: clusters, mountPath: /etc/headlamp/clusters, readOnly: true}
        - name: oauth2-proxy
          image: {{ $image | quote }}
          args:
            - --provider=google
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:4466
            - --proxy-prefix=/gke/oauth2
            - {{ printf "--redirect-url=https://%s/gke/oauth2/callback" .Values.host | quote }}
            - "--scope=openid email profile https://www.googleapis.com/auth/cloud-platform"
            - --prompt=consent
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --pass-user-headers=true
            - --pass-basic-auth=false
            - --skip-auth-strip-headers=true
            - --reverse-proxy=true
            - {{ printf "--whitelist-domain=%s" .Values.host | quote }}
            - --request-logging=false
            {{- range $trusted }}
            - {{ printf "--trusted-proxy-ip=%s" . | quote }}
            {{- end }}
            - --cookie-name=__Secure-headlamp_gke
            - --cookie-path=/gke
            - --cookie-refresh=5m
            - --cookie-expire=168h
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --ping-path=/ping
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: client-id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: cookie-secret}}
          ports: [{name: proxy, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: proxy}}
          livenessProbe: {httpGet: {path: /ping, port: proxy}, initialDelaySeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: oauth, mountPath: /etc/oauth2-proxy, readOnly: true}
      volumes:
        - name: clusters
          secret: {secretName: {{ $clusters | quote }}, defaultMode: 0440}
        - name: oauth
          secret:
            secretName: {{ $secret | quote }}
            defaultMode: 0440
            items: [{key: allowed-emails, path: allowed-emails}]
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-gke-google
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: headlamp-gke-google}
  ports: [{name: http, port: 80, targetPort: proxy}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-gke-google
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .Values.albGroup | quote }}
    alb.ingress.kubernetes.io/group.order: "19"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /ping
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /gke
            pathType: Prefix
            backend:
              service: {name: headlamp-gke-google, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-gke-google
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: headlamp-gke-google}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $trusted }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 4180}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}]
