# Install manually only after the pinned operator and its CRDs exist in
# hopcharlie-db-network; this chart never creates a Namespace or a Secret.
enabled: false
clusterId: "" # management, eks or gke

# Workload profiles only. The namespace and CNPG Cluster must already exist.
localDatabase:
  namespace: ""
  cluster: ""

# Workload ingress is a separate Service; the CNPG -rw Service is never adopted.
ingress:
  hostname: ""
  tag: ""

egress:
  tag: ""
  # management: eks + gke; eks: gke; gke: eks.
  # Each peer requires a unique local hostname and the remote ingress full FQDN.
  peers: {}

# Workload profiles only (infra ADR 0063). Shared objects for the database
# proxies of platform apps registered in two environments, so a new app needs
# no change to this release: ProxyClasses hopcharlie-app-db-ingress-<clusterId>
# and hopcharlie-app-db-egress-<clusterId>, which label their proxy pods
# hopcharlie.dev/db-proxy: ingress|egress, and NetworkPolicies for those pods.
# The app chart's Services in the app namespaces use them, with the tags
# above (ingress.tag, egress.tag).
platformApps:
  enabled: false

# Unmeasured starting point; size from the approved connectivity/load trial.
proxyResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Existing DB/API namespace guardrails MUST already allow their ordinary
# traffic (DNS, Kubernetes API, backup/identity endpoints and CNPG replication).
# This chart only adds exact proxy allowances; Egress policies isolate selected
# clients if those pre-existing guardrails are absent.
