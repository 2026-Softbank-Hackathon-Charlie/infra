{{- /* onprem has no static database path (infra ADR 0072): only platformApps. */}}
{{- if and .Values.enabled (ne .Values.clusterId "onprem") }}
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: hopcharlie-db-network-{{ .Values.clusterId }}
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          {{- toYaml .Values.proxyResources | nindent 10 }}
{{- end }}
