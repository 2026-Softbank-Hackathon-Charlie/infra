{{- if and (index .Values "otel-collector" "enabled") .Values.langfuse.enabled }}
{{- $ip := .Values.langfuse.serviceClusterIP | default "" }}
{{- if and $ip (not (regexMatch "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$" $ip)) }}
{{- fail "langfuse.serviceClusterIP must be one exact IPv4 Service address" }}
{{- end }}
{{- if and $ip (not (regexMatch "^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)" $ip)) }}
{{- fail "langfuse.serviceClusterIP must be a private RFC1918 address" }}
{{- end }}
{{- $uid := .Values.langfuse.serviceUID | default "" }}
{{- if and $ip (not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $uid)) }}
{{- fail "langfuse.serviceUID must bind the exact existing Service" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickstack-langfuse-egress
  {{- if $ip }}
  annotations:
    hopcharlie.dev/langfuse-service-uid: {{ $uid | quote }}
    hopcharlie.dev/langfuse-service-ip: {{ $ip | quote }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: clickstack-collector}
  policyTypes: [Egress]
  egress:
    # Selecting a previously unisolated collector for Egress also isolates its
    # existing dependencies. Preserve DNS and the original ClickHouse exporter.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: clickhouse-server}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        {{- if $ip }}
        # EKS may enforce this path before Service DNAT. The current Service
        # identity is operator-bound; retain the Pod selector after DNAT too.
        - ipBlock: {cidr: {{ printf "%s/32" $ip | quote }}}
        {{- end }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: langfuse}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
              app.kubernetes.io/instance: langfuse
              app.kubernetes.io/component: web
      ports: [{protocol: TCP, port: 3000}]
{{- end }}
