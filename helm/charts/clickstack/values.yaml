{
  "global": {
    "imageRegistry": "",
    "imagePullSecrets": [],
    "otelCollector": {
      "customConfig": "extensions:\n  file_storage/queue:\n    directory: /var/lib/otelcol/queue\n    create_directory: true\n  health_check:\n    endpoint: :13133\nreceivers:\n  otlp/hyperdx:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\n        tls:\n          cert_file: /etc/otel/tls/tls.crt\n          key_file: /etc/otel/tls/tls.key\nexporters:\n  clickhouse:\n    database: ${env:HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE}\n    endpoint: ${env:CLICKHOUSE_ENDPOINT}\n    password: ${env:CLICKHOUSE_PASSWORD}\n    username: ${env:CLICKHOUSE_USER}\n    timeout: ${env:HYPERDX_OTEL_EXPORTER_TIMEOUT:-5s}\n    create_schema: ${env:HYPERDX_OTEL_EXPORTER_CREATE_LEGACY_SCHEMA:-false}\n    json: ${env:HYPERDX_OTEL_EXPORTER_CLICKHOUSE_JSON_ENABLE:-false}\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time: 0s\n    sending_queue:\n      enabled: true\n      queue_size: 1000\n      storage: file_storage/queue\nservice:\n  extensions:\n  - health_check\n  - bearertokenauth/hyperdx\n  - file_storage/queue\n  pipelines:\n    logs:\n      receivers:\n      - otlp/hyperdx\n      processors:\n      - memory_limiter/central\n      - transform\n      - batch/central\n      exporters:\n      - clickhouse\n    traces:\n      receivers:\n      - otlp/hyperdx\n      processors:\n      - memory_limiter/central\n      - batch/central\n      exporters:\n      - clickhouse\n  telemetry:\n    metrics:\n      readers:\n      - pull:\n          exporter:\n            prometheus:\n              host: 0.0.0.0\n              port: 8888\n    logs:\n      level: ${HYPERDX_LOG_LEVEL}\n      output_paths:\n      - stdout\nprocessors:\n  memory_limiter/central:\n    limit_mib: 384\n    spike_limit_mib: 96\n    check_interval: 1s\n  batch/central:\n    send_batch_size: 512\n    send_batch_max_size: 1024\n    timeout: 1s\n  transform:\n    log_statements:\n    - context: log\n      error_mode: ignore\n      statements:\n      - set(log.cache, ExtractPatterns(log.body, \"(?P<0>(\\\\{.*\\\\}))\")) where IsString(log.body)\n      - merge_maps(log.attributes, ParseJSON(log.cache[\"0\"]), \"upsert\") where IsMap(log.cache)\n      - flatten(log.attributes) where IsMap(log.cache)\n      - merge_maps(log.attributes, log.body, \"upsert\") where IsMap(log.body)\n    - context: log\n      error_mode: ignore\n      conditions:\n      - severity_number == 0 and severity_text == \"\"\n      statements:\n      - set(log.severity_text, log.attributes[\"level\"])     where log.severity_text\n        == \"\" and IsString(log.attributes[\"level\"])     and Len(log.attributes[\"level\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"Level\"])     where log.severity_text\n        == \"\" and IsString(log.attributes[\"Level\"])     and Len(log.attributes[\"Level\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"LEVEL\"])     where log.severity_text\n        == \"\" and IsString(log.attributes[\"LEVEL\"])     and Len(log.attributes[\"LEVEL\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"severity\"])  where log.severity_text\n        == \"\" and IsString(log.attributes[\"severity\"])  and Len(log.attributes[\"severity\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"Severity\"])  where log.severity_text\n        == \"\" and IsString(log.attributes[\"Severity\"])  and Len(log.attributes[\"Severity\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"SEVERITY\"])  where log.severity_text\n        == \"\" and IsString(log.attributes[\"SEVERITY\"])  and Len(log.attributes[\"SEVERITY\"])\n        > 0\n      - set(log.severity_text, log.attributes[\"log.level\"]) where log.severity_text\n        == \"\" and IsString(log.attributes[\"log.level\"]) and Len(log.attributes[\"log.level\"])\n        > 0\n      - set(log.severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(log.severity_text,\n        \"(?i)(alert|crit|emerg|fatal)\")\n      - set(log.severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(log.severity_text,\n        \"(?i)(error|err)\")\n      - set(log.severity_number, SEVERITY_NUMBER_WARN)  where IsMatch(log.severity_text,\n        \"(?i)(warn|notice)\")\n      - set(log.severity_number, SEVERITY_NUMBER_INFO)  where IsMatch(log.severity_text,\n        \"(?i)(info)\")\n      - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(log.severity_text,\n        \"(?i)(debug|dbug)\")\n      - set(log.severity_number, SEVERITY_NUMBER_TRACE) where IsMatch(log.severity_text,\n        \"(?i)(trace)\")\n      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_number ==\n        0 and log.severity_text != \"\"\n    - context: log\n      error_mode: ignore\n      conditions:\n      - severity_number == 0 and severity_text == \"\"\n      statements:\n      - set(log.cache[\"substr\"], log.body.string) where Len(log.body.string) < 256\n      - set(log.cache[\"substr\"], Substring(log.body.string, 0, 256)) where Len(log.body.string)\n        >= 256\n      - set(log.cache, ExtractPatterns(log.cache[\"substr\"], \"(?i)(?P<0>\\\\b(alert|crit|emerg|fatal|error|err|warn|notice|debug|dbug|trace))\"))\n      - set(log.severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(log.cache[\"0\"],\n        \"(?i)(alert|crit|emerg|fatal)\")\n      - set(log.severity_text, \"fatal\") where log.severity_number == SEVERITY_NUMBER_FATAL\n      - set(log.severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(log.cache[\"0\"],\n        \"(?i)(error|err)\")\n      - set(log.severity_text, \"error\") where log.severity_number == SEVERITY_NUMBER_ERROR\n      - set(log.severity_number, SEVERITY_NUMBER_WARN) where IsMatch(log.cache[\"0\"],\n        \"(?i)(warn|notice)\")\n      - set(log.severity_text, \"warn\") where log.severity_number == SEVERITY_NUMBER_WARN\n      - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(log.cache[\"0\"],\n        \"(?i)(debug|dbug)\")\n      - set(log.severity_text, \"debug\") where log.severity_number == SEVERITY_NUMBER_DEBUG\n      - set(log.severity_number, SEVERITY_NUMBER_TRACE) where IsMatch(log.cache[\"0\"],\n        \"(?i)(trace)\")\n      - set(log.severity_text, \"trace\") where log.severity_number == SEVERITY_NUMBER_TRACE\n      - set(log.severity_text, \"info\") where log.severity_number == 0\n      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_number ==\n        0\n    - context: log\n      error_mode: ignore\n      statements:\n      - set(log.severity_text, ConvertCase(log.severity_text, \"lower\"))\n"
    }
  },
  "hyperdx": {
    "ports": {
      "api": 8000,
      "app": 3000,
      "opamp": 4320
    },
    "dashboards": {
      "enabled": false,
      "namespaces": [],
      "rbac": {
        "create": true
      },
      "sidecarImage": "kiwigrid/k8s-sidecar:2.10.1",
      "sidecarPullPolicy": "IfNotPresent",
      "configMaps": {},
      "resources": {
        "limits": {
          "cpu": "50m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "32Mi"
        }
      }
    },
    "config": {
      "APP_PORT": "3000",
      "API_PORT": "8000",
      "HYPERDX_API_PORT": "8000",
      "HYPERDX_APP_PORT": "3000",
      "HYPERDX_LOG_LEVEL": "info",
      "OTEL_SERVICE_NAME": "hdx-oss-api",
      "USAGE_STATS_ENABLED": "false",
      "OPAMP_PORT": "4320",
      "HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE": "default",
      "CLICKHOUSE_USER": "otelcollector",
      "RUN_SCHEDULED_TASKS_EXTERNALLY": "false",
      "HYPERDX_OTEL_EXPORTER_TABLES_TTL": "168h",
      "FRONTEND_URL": "http://localhost:3000",
      "OTEL_EXPORTER_OTLP_ENDPOINT": "http://{{ include \"clickstack.otel.fullname\" . }}:4318",
      "CLICKHOUSE_ENDPOINT": "tcp://{{ include \"clickstack.clickhouse.svc\" . }}:{{ .Values.clickhouse.nativePort }}?dial_timeout=10s",
      "CLICKHOUSE_SERVER_ENDPOINT": "{{ include \"clickstack.clickhouse.svc\" . }}:{{ .Values.clickhouse.nativePort }}",
      "OPAMP_SERVER_URL": "",
      "ENABLE_PROMQL": "true",
      "NEXT_PUBLIC_ENABLE_PROMQL": "true",
      "HYPERDX_OTEL_EXPORTER_LOGS_TTL": "168h",
      "HYPERDX_OTEL_EXPORTER_TRACES_TTL": "72h",
      "HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL": "true",
      "HYPERDX_OPAMP_PORT": "4320",
      "HDX_EXPORTER_ENABLED": "false"
    },
    "deployment": {
      "image": {
        "repository": "docker.hyperdx.io/hyperdx/hyperdx",
        "tag": "2.39.1@sha256:619783ca66d6c81f72a0106f4013d65865ac42e064491b19c0019ffec268f316"
      },
      "replicas": 1,
      "resources": {
        "requests": {
          "cpu": "100m",
          "memory": "512Mi"
        },
        "limits": {
          "memory": "1Gi"
        }
      },
      "livenessProbe": {
        "enabled": true,
        "path": "/health",
        "initialDelaySeconds": 10,
        "periodSeconds": 30,
        "timeoutSeconds": 5,
        "failureThreshold": 3
      },
      "readinessProbe": {
        "enabled": true,
        "path": "/ready",
        "initialDelaySeconds": 1,
        "periodSeconds": 10,
        "timeoutSeconds": 5,
        "failureThreshold": 3
      },
      "nodeSelector": {},
      "tolerations": [],
      "topologySpreadConstraints": [],
      "priorityClassName": "",
      "deploymentAnnotations": {},
      "podAnnotations": {},
      "annotations": {},
      "labels": {},
      "podLabels": {},
      "env": [],
      "initContainers": [],
      "volumes": [],
      "volumeMounts": [],
      "podSecurityContext": {},
      "containerSecurityContext": {},
      "waitForMongodb": {
        "image": "docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e",
        "pullPolicy": "IfNotPresent"
      },
      "useExistingConfigSecret": true,
      "existingConfigSecret": "clickstack-ui-config",
      "existingConfigConnectionsKey": "connections.json",
      "existingConfigSourcesKey": "sources.json",
      "defaultConnections": "",
      "defaultSources": ""
    },
    "service": {
      "type": "ClusterIP",
      "annotations": {},
      "apiPort": {
        "enabled": true
      }
    },
    "ingress": {
      "enabled": false,
      "annotations": {},
      "spec": {},
      "additionalIngresses": []
    },
    "podDisruptionBudget": {
      "enabled": false
    },
    "autoscaling": {
      "enabled": false,
      "spec": {}
    },
    "networkPolicy": {
      "enabled": false,
      "spec": {}
    },
    "serviceAccount": {
      "create": false,
      "name": "",
      "annotations": {}
    },
    "tasks": {
      "enabled": false,
      "checkAlerts": {
        "schedule": "*/1 * * * *",
        "additionalArgs": {},
        "resources": {
          "limits": {
            "cpu": "200m",
            "memory": "256Mi"
          },
          "requests": {
            "cpu": "100m",
            "memory": "128Mi"
          }
        }
      }
    },
    "queryTrust": {
      "enabled": false,
      "configMap": "observability-metrics-query-ca"
    }
  },
  "mongodb": {
    "enabled": true,
    "spec": {
      "members": 1,
      "type": "ReplicaSet",
      "version": "8.0.17",
      "security": {
        "authentication": {
          "modes": [
            "SCRAM"
          ]
        }
      },
      "users": [
        {
          "name": "hyperdx",
          "db": "hyperdx",
          "passwordSecretRef": {
            "name": "{{ .Values.existingSecrets.mongodb }}"
          },
          "roles": [
            {
              "name": "dbOwner",
              "db": "hyperdx"
            },
            {
              "name": "clusterMonitor",
              "db": "admin"
            }
          ],
          "scramCredentialsSecretName": "{{ include \"clickstack.mongodb.fullname\" . }}-scram"
        }
      ],
      "additionalMongodConfig": {
        "storage.wiredTiger.engineConfig.journalCompressor": "zlib"
      },
      "statefulSet": {
        "spec": {
          "template": {
            "spec": {
              "containers": [
                {
                  "name": "mongod",
                  "image": "quay.io/mongodb/mongodb-community-server:8.0.17-ubi9@sha256:9905955c5e256352c47401d22f38e5de3281843bfa6f51b3a61dcad5c1725157",
                  "resources": {
                    "requests": {
                      "cpu": "100m",
                      "memory": "512Mi"
                    },
                    "limits": {
                      "memory": "1Gi"
                    }
                  }
                },
                {
                  "name": "mongodb-agent",
                  "resources": {
                    "requests": {
                      "cpu": "50m",
                      "memory": "128Mi"
                    },
                    "limits": {
                      "memory": "256Mi"
                    }
                  }
                }
              ]
            }
          },
          "volumeClaimTemplates": [
            {
              "metadata": {
                "name": "data-volume"
              },
              "spec": {
                "accessModes": [
                  "ReadWriteOnce"
                ],
                "storageClassName": "gp3",
                "resources": {
                  "requests": {
                    "storage": "5Gi"
                  }
                }
              }
            },
            {
              "metadata": {
                "name": "logs-volume"
              },
              "spec": {
                "accessModes": [
                  "ReadWriteOnce"
                ],
                "storageClassName": "gp3",
                "resources": {
                  "requests": {
                    "storage": "1Gi"
                  }
                }
              }
            }
          ]
        }
      }
    }
  },
  "clickhouse": {
    "enabled": true,
    "port": 8123,
    "nativePort": 9000,
    "prometheus": {
      "enabled": true,
      "port": 9363
    },
    "keeper": {
      "spec": {
        "containerTemplate": {
          "image": {
            "repository": "docker.io/clickhouse/clickhouse-keeper",
            "tag": "26.8.36.3-alpine@sha256:82cb1687db7d461b180ac17b5a7a1db91d9fcbf8ba91aa32aea85998cd61383d"
          },
          "resources": {
            "requests": {
              "cpu": "50m",
              "memory": "128Mi"
            },
            "limits": {
              "memory": "256Mi"
            }
          }
        },
        "replicas": 1,
        "dataVolumeClaimSpec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          },
          "storageClassName": "gp3"
        }
      }
    },
    "cluster": {
      "spec": {
        "containerTemplate": {
          "image": {
            "repository": "docker.io/clickhouse/clickhouse-server",
            "tag": "26.8.36.3-alpine@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d"
          },
          "resources": {
            "requests": {
              "cpu": "500m",
              "memory": "2Gi"
            },
            "limits": {
              "memory": "2Gi"
            }
          },
          "env": [
            {
              "name": "CH_READ_PASSWORD",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "{{ .Values.existingSecrets.clickhouse }}",
                  "key": "read-password"
                }
              }
            },
            {
              "name": "CH_INGEST_PASSWORD",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "{{ .Values.existingSecrets.clickhouse }}",
                  "key": "ingest-password"
                }
              }
            }
          ]
        },
        "replicas": 1,
        "shards": 1,
        "keeperClusterRef": {
          "name": "{{ include \"clickstack.clickhouse.keeper\" . }}"
        },
        "dataVolumeClaimSpec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "20Gi"
            }
          },
          "storageClassName": "gp3"
        },
        "settings": {
          "extraUsersConfig": {
            "users": {
              "app": {
                "password": [
                  {
                    "@from_env": "CH_READ_PASSWORD"
                  }
                ],
                "profile": "hyperdx-read",
                "grants": {
                  "query": [
                    "GRANT SHOW ON *.*",
                    "GRANT SELECT ON default.*",
                    "GRANT SELECT ON system.*"
                  ]
                }
              },
              "otelcollector": {
                "password": [
                  {
                    "@from_env": "CH_INGEST_PASSWORD"
                  }
                ],
                "profile": "default",
                "grants": {
                  "query": [
                    "GRANT SELECT, INSERT, CREATE, ALTER, SHOW ON default.*"
                  ]
                }
              }
            },
            "profiles": {
              "hyperdx-read": {
                "readonly": 2
              }
            }
          },
          "logger": {
            "level": "information",
            "size": "100M",
            "count": 10
          },
          "extraConfig": {
            "max_connections": 4096,
            "keep_alive_timeout": 64,
            "max_concurrent_queries": 100,
            "query_log": {
              "ttl": "event_date + INTERVAL 7 DAY DELETE"
            },
            "part_log": {
              "ttl": "event_date + INTERVAL 7 DAY DELETE"
            },
            "text_log": {
              "ttl": "event_date + INTERVAL 7 DAY DELETE"
            },
            "metric_log": {
              "ttl": "event_date + INTERVAL 7 DAY DELETE"
            },
            "asynchronous_metric_log": {
              "ttl": "event_date + INTERVAL 7 DAY DELETE"
            }
          },
          "defaultUserPassword": {
            "secret": {
              "name": "{{ .Values.existingSecrets.clickhouse }}",
              "key": "default-password"
            },
            "passwordType": "password"
          }
        }
      }
    }
  },
