{{- include "hopcharlie-app.check" . }}
{{- $profile := .Values.profile }}
{{- range $svc := .Values.values.services }}
{{- $ctx := dict "root" $ "svc" $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Values.values.app $svc.name }}
  labels:
    {{- include "hopcharlie-app.labels" $ctx | nindent 4 }}
    {{- if $.Values.values.onboardingCold }}
    # Down until the cutover starts it (platform ADR 0042): the ApplicationSet
    # ignores spec.replicas of a Deployment with this label (infra ADR 0082).
    hopcharlie.dev/onboarding-cold: "true"
    {{- end }}
  {{- if or $.Values.commit $.Values.deployment }}
  # Not on the pods: a new deployment of the same commit restarts nothing.
  annotations:
    {{- with $.Values.commit }}
    hopcharlie.dev/commit: {{ . | quote }}
    {{- end }}
    {{- with $.Values.deployment }}
    hopcharlie.dev/deployment: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ if $.Values.values.onboardingCold }}0{{ else if hasKey $svc "replicas" }}{{ $svc.replicas }}{{ else }}1{{ end }}
  revisionHistoryLimit: 3
  {{- if not $svc.port }}
  # A worker has no probe: it counts as available once it has run this long
  # without a restart, so one that crashes at start leaves the old pods.
  minReadySeconds: 10
  {{- end }}
  # A new version that never becomes ready stops here; the old pods serve.
  progressDeadlineSeconds: {{ $profile.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hopcharlie-app.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopcharlie-app.labels" $ctx | nindent 8 }}
        {{- if $.Values.profile.observability.enabled }}
        observability.hopcharlie.dev/enabled: "true"
        observability.hopcharlie.dev/kind: application
        app.kubernetes.io/version: {{ $.Values.commit | default "unknown" | trunc 63 | quote }}
        {{- end }}
      {{- if or $.Values.values.sealedSecrets.appChecksum $.Values.profile.observability.enabled }}
      annotations:
        {{- with $.Values.values.sealedSecrets.appChecksum }}
      # Sealing gives new ciphertexts on every deploy; this changes only with
      # the secrets themselves, so the pods restart exactly then.
        hopcharlie.dev/secrets-checksum: {{ . | quote }}
        {{- end }}
        {{- if $.Values.profile.observability.enabled }}
        checksum/observability-ca: {{ $.Values.profile.observability.caBundle | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT style variables next to the platform's own.
      enableServiceLinks: false
      {{- with $profile.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $profile.runAsUser }}
        runAsGroup: {{ $profile.runAsUser }}
        fsGroup: {{ $profile.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image | quote }}
          {{- with $profile.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with $svc.port }}
          ports:
            - name: http
              containerPort: {{ . }}
          {{- end }}
          {{- if $.Values.values.sealedSecrets.app }}
          # env below wins over envFrom for the same name; the platform drops
          # such names from env itself (platform ADR 0019).
          envFrom:
            - secretRef:
                name: app-secrets
          {{- end }}
          {{- $platformEnv := include "hopcharlie-app.platformEnv" $ctx | trim }}
          {{- $otelEnv := include "hopcharlie-app.otelEnv" $ctx | trim }}
          {{- if or $platformEnv $svc.env $otelEnv }}
          env:
            {{- with $platformEnv }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $otelEnv }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if not $svc.port }}
          # A worker: no port to probe, so a running container is ready.
          {{- else if $svc.healthCheck }}
          # Up to 3 minutes to start (an app may wait for its database)
          # before liveness applies.
          startupProbe:
            httpGet:
              path: {{ $svc.healthCheck }}
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: {{ $svc.healthCheck }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: {{ $svc.healthCheck }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 2
          {{- end }}
          {{- with $profile.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          {{- with include "hopcharlie-app.resources" $ctx }}
          resources:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if $.Values.profile.observability.enabled }}
          volumeMounts:
            - {name: observability-ca, mountPath: /etc/otel/ca, readOnly: true}
          {{- end }}
      {{- if $.Values.profile.observability.enabled }}
      volumes:
        - name: observability-ca
          configMap: {name: hopcharlie-observability-ca}
      {{- end }}
{{- end }}
