{{- if (.Values.api.onpremRegistration | default dict).enabled }}
# Pure validation on the existing public TLS endpoint. No new credential or
# certificate is created by this chart. Every matching error is fail closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: hopcharlie-onprem-cluster-secret
webhooks:
  - name: hopcharlie-onprem-secret.hopcharlie.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      url: https://api.hopcharlie.dev/v1/onprem/admission/cluster-secret
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: argocd}
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        scope: Namespaced
    matchConditions:
      - name: dedicated-api-only
        expression: request.userInfo.username == 'system:serviceaccount:charlie-platform:hopcharlie-platform-api' && request.namespace == 'argocd'
      - name: owned-new-object
        expression: >-
          has(object.metadata.labels) &&
          'hopcharlie.dev/onprem-enrollment' in object.metadata.labels &&
          object.metadata.labels['hopcharlie.dev/onprem-enrollment'].matches('^enr_[a-f0-9]{24}$') &&
          object.metadata.name == 'hop-onprem-' + object.metadata.labels['hopcharlie.dev/onprem-enrollment'].substring(4) &&
          'hopcharlie.dev/onprem-cluster-uid' in object.metadata.labels &&
          object.metadata.labels['hopcharlie.dev/onprem-cluster-uid'].matches('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$')
      # A rejected foreign update must never send an existing cloud Secret's
      # oldObject to this API endpoint, even if the caller adds an owner label.
      - name: owned-old-object
        expression: >-
          request.operation == 'CREATE' ||
          (oldObject != null && has(oldObject.metadata.labels) &&
          'hopcharlie.dev/onprem-enrollment' in oldObject.metadata.labels &&
          oldObject.metadata.labels['hopcharlie.dev/onprem-enrollment'] == object.metadata.labels['hopcharlie.dev/onprem-enrollment'] &&
          'hopcharlie.dev/onprem-cluster-uid' in oldObject.metadata.labels &&
          oldObject.metadata.labels['hopcharlie.dev/onprem-cluster-uid'] == object.metadata.labels['hopcharlie.dev/onprem-cluster-uid'] &&
          oldObject.metadata.name == object.metadata.name)
{{- end }}
