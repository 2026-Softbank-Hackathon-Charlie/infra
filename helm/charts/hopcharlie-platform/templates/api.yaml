apiVersion: v1
kind: Service
metadata:
  name: hopcharlie-api
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# Run documents and engine state (-state-dir) survive a restart, like the
# apidata volume on the EC2 host.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hopcharlie-api-data
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.api | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopcharlie-api
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
spec:
  replicas: 1
  # One writer of the run state on an EBS volume, so the old pod stops first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopcharlie.labels" "api" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopcharlie.labels" "api" | nindent 8 }}
    spec:
      serviceAccountName: hopcharlie-platform
      # The deploy executor patches Argo CD Applications in this cluster.
      automountServiceAccountToken: {{ not (empty .Values.deploy.builder) }}
      securityContext:
        {{- include "hopcharlie.podSecurity" 10001 | nindent 8 }}
      initContainers:
        {{- include "hopcharlie.fetchSettings" (dict "root" $ "fetch" "api") | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.images.platform | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # KEY=value lines, values taken literally (no shell expansion).
              for f in /config/api.env /config/db-passwords.env /config/rclone.env; do
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in ''|'#'*) ;; *=*) export "$line" ;; esac
                done < "$f"
              done
              exec hopcharlie-api -addr :8080 -state-dir /data/runs
          env:
            - {name: PLATFORM_ENVS_FILE, value: /config/envs.yaml}
            - {name: PLATFORM_APPS_FILE, value: /config/apps.yaml}
            - {name: PLATFORM_GATEWAY_URL, value: "http://hopcharlie-gateway:9901"}
            - {name: PLATFORM_CORS_ORIGINS, value: {{ .Values.api.corsOrigins | quote }}}
            - {name: PLATFORM_DSN_HOST_SUFFIXES, value: {{ .Values.api.dsnHostSuffixes | quote }}}
            - {name: PLATFORM_AWS_REGION, value: {{ .Values.awsRegion | quote }}}
            {{- with .Values.appDomain }}
            - {name: PLATFORM_APP_DOMAIN, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.github.appId }}
            # The private key and the webhook secret come from SSM (fetch-settings.sh).
            - {name: PLATFORM_GITHUB_APP_ID, value: {{ . | quote }}}
            - {name: PLATFORM_GITHUB_APP_PRIVATE_KEY_FILE, value: /config/github-app.pem}
            {{- end }}
            {{- with .Values.github.installationId }}
            - {name: PLATFORM_GITHUB_INSTALLATION_ID, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.deploy.builder }}
            {{- if not $.Values.github.appId }}
            {{- fail "deploy.builder needs github.appId" }}
            {{- end }}
            - {name: PLATFORM_DEPLOY_BUILDER, value: {{ . | quote }}}
            - {name: PLATFORM_IMAGE_REGISTRY, value: {{ required "deploy.imageRegistry is required with deploy.builder" $.Values.deploy.imageRegistry | quote }}}
            {{- if eq . "codebuild" }}
            - {name: PLATFORM_CODEBUILD_PROJECT, value: {{ required "deploy.codebuildProject is required with deploy.builder codebuild" $.Values.deploy.codebuildProject | quote }}}
            {{- end }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            {{- include "hopcharlie.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: settings, mountPath: /config, readOnly: true}
      volumes:
        {{- include "hopcharlie.settingsVolumes" . | nindent 8 }}
        - name: data
          persistentVolumeClaim:
            claimName: hopcharlie-api-data
