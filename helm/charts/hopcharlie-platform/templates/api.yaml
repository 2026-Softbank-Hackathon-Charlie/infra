apiVersion: v1
kind: Service
metadata:
  name: hopcharlie-api
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# Run documents and engine state (-state-dir) survive a restart, like the
# apidata volume on the EC2 host.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hopcharlie-api-data
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.api | quote }}
{{- $gkeRegistry := .Values.deploy.gkeImageRegistry | default "" }}
{{- $gkeCredentials := .Values.deploy.gkeImageCredentialConfig | default (dict) }}
{{- if or $gkeRegistry $gkeCredentials }}
{{- if not (and $gkeRegistry $gkeCredentials) }}
{{- fail "deploy.gkeImageRegistry and deploy.gkeImageCredentialConfig go together" }}
{{- end }}
{{- if ne .Values.deploy.builder "codebuild" }}
{{- fail "GKE image publication needs deploy.builder codebuild" }}
{{- end }}
{{- if or (ne (get $gkeCredentials "type") "external_account") (ne (dig "credential_source" "environment_id" "" $gkeCredentials) "aws1") }}
{{- fail "deploy.gkeImageCredentialConfig must be an AWS external_account (aws1) ADC config" }}
{{- end }}
{{- end }}
{{- $gcp := .Values.gcp }}
{{- if or $gcp.credentialConfig $gcp.tokenAudience }}
{{- if not (and $gcp.credentialConfig $gcp.tokenAudience) }}
{{- fail "gcp.credentialConfig and gcp.tokenAudience go together" }}
{{- end }}
{{- if ne (dig "credential_source" "file" "" $gcp.credentialConfig) "/var/run/secrets/gcp/token" }}
{{- fail "gcp.credentialConfig.credential_source.file must be /var/run/secrets/gcp/token" }}
{{- end }}
---
# Public Google ADC configuration (infra ADR 0041): no key, only where to find
# the projected token and which service account to impersonate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-gcp-adc
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
data:
  adc.json: {{ toJson $gcp.credentialConfig | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopcharlie-api
  labels:
    {{- include "hopcharlie.labels" "api" | nindent 4 }}
spec:
  replicas: 1
  # One writer of the run state on an EBS volume, so the old pod stops first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopcharlie.labels" "api" | nindent 6 }}
  template:
    metadata:
        {{- if or .Values.api.parity.enabled (.Values.api.onpremRegistration | default dict).enabled .Values.hopai.enabled (.Values.api.langfuse | default dict).enabled }}
      annotations:
        {{- if .Values.api.parity.enabled }}
        checksum/parity: {{ toJson .Values.api.parity.config | sha256sum }}
        {{- end }}
        {{- if (.Values.api.onpremRegistration | default dict).enabled }}
        checksum/onprem-registration: {{ toJson .Values.api.onpremRegistration | sha256sum }}
        {{- end }}
        {{- if .Values.hopai.enabled }}
        # The API copies this Job template at boot; a ConfigMap update alone is not enough.
        checksum/hopai: {{ include (print $.Template.BasePath "/hopai.yaml") . | sha256sum }}
        {{- end }}
        {{- if (.Values.api.langfuse | default dict).enabled }}
        # App bindings and project key files are read once at API startup.
        checksum/langfuse: {{ include "hopcharlie.langfuseConfig" . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "hopcharlie.labels" "api" | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hopcharlie.apiServiceAccount" . }}
      # The deploy executor patches Argo CD Applications in this cluster, the AI
      # runner's Jobs are created here (hopai.yaml), and app DB routes too (ADR 0064).
      automountServiceAccountToken: {{ or (not (empty .Values.deploy.builder)) .Values.hopai.enabled (not (empty .Values.api.appDbTopology.route.tailnet)) (.Values.api.onpremRegistration | default dict).enabled }}
      securityContext:
        {{- include "hopcharlie.podSecurity" 10001 | nindent 8 }}
      initContainers:
        {{- include "hopcharlie.fetchSettings" (dict "root" $ "fetch" "api") | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.images.platform | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # KEY=value lines, values taken literally (no shell expansion).
              for f in /config/api.env /config/db-passwords.env /config/rclone.env; do
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in ''|'#'*) ;; *=*) export "$line" ;; esac
                done < "$f"
              done
              exec hopcharlie-api -addr :8080 -state-dir /data/runs
          env:
            - {name: PLATFORM_ENVS_FILE, value: /config/envs.yaml}
            {{- if (.Values.api.langfuse | default dict).enabled }}
            - {name: PLATFORM_LANGFUSE_CONFIG, value: /etc/langfuse/config.json}
            {{- end }}
            {{- if (.Values.api.onpremRegistration | default dict).enabled }}
            - {name: PLATFORM_ONPREM_REGISTRATION, value: "1"}
            - {name: PLATFORM_ONPREM_PROFILE_FILE, value: /etc/onprem/profile.json}
            - {name: PLATFORM_ONPREM_TAILNET_DOMAIN, value: {{ .Values.api.onpremRegistration.tailnetDomain | quote }}}
            - {name: PLATFORM_ONPREM_AGENT_DIRECTORY, value: /usr/local/lib/hopcharlie-onprem-agent}
            - {name: PLATFORM_ONPREM_AGENT_IMAGE, value: {{ required "onprem agentImage is required" .Values.api.onpremRegistration.agentImage | quote }}}
            - {name: PLATFORM_ONPREM_TAILSCALE_IMAGE, value: {{ required "onprem tailscaleImage is required" .Values.api.onpremRegistration.tailscaleImage | quote }}}
            - {name: PLATFORM_ONPREM_HELLO_IMAGE, value: {{ required "onprem helloImage is required" .Values.api.onpremRegistration.helloImage | quote }}}
            {{- end }}
            {{- with .Values.api.aiobs }}
            {{- if .enabled }}
            # GET /v1/ai-activity reads the AI runner's log lines from the observability
            # ClickHouse (infra ADR 0077). The password comes from SSM (fetch-settings.sh).
            - {name: PLATFORM_AIOBS_CLICKHOUSE_URL, value: {{ required "api.aiobs.url is required with api.aiobs.enabled" .url | quote }}}
            - {name: PLATFORM_AIOBS_CLICKHOUSE_USER, value: {{ required "api.aiobs.user is required with api.aiobs.enabled" .user | quote }}}
            - {name: PLATFORM_AIOBS_CLICKHOUSE_PASSWORD_FILE, value: /config/aiobs-clickhouse-password}
            {{- with .table }}
            - {name: PLATFORM_AIOBS_CLICKHOUSE_TABLE, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.parity }}
            {{- if .enabled }}
            - {name: PLATFORM_PARITY_FILE, value: /etc/parity/parity.json}
            {{- end }}
            {{- end }}
            - {name: PLATFORM_GATEWAY_URL, value: "http://hopcharlie-gateway:9901"}
            # The canary sends synthetic reads through the public proxy, so a
            # migration of an app without users still has its target judged.
            - {name: PLATFORM_GATEWAY_PROXY_URL, value: "http://hopcharlie-gateway:8000"}
            - {name: PLATFORM_CORS_ORIGINS, value: {{ .Values.api.corsOrigins | quote }}}
            - {name: PLATFORM_DSN_HOST_SUFFIXES, value: {{ .Values.api.dsnHostSuffixes | quote }}}
            - {name: PLATFORM_AWS_REGION, value: {{ .Values.awsRegion | quote }}}
            {{- with .Values.api.appDbTopology }}
            {{- if .enabled }}
            # Apps registered in two environments get born-paired databases (infra ADR 0063).
            # Turn on only after the workload db-network, access and dbNetwork profile steps.
            - {name: PLATFORM_APP_DB_TOPOLOGY, value: "1"}
            {{- end }}
            {{- with .hostTemplates }}
            # <env>=<management DB host with {instance}>,...; the hosts must also match
            # PLATFORM_DSN_HOST_SUFFIXES (.hopcharlie-db-network.svc.cluster.local, infra #99).
            - {name: PLATFORM_APP_DB_HOST_TEMPLATES, value: {{ . | quote }}}
            {{- end }}
            {{- with .route }}
            {{- if or .tailnet .proxyClass .tag }}
            {{- if not (and .tailnet .proxyClass .tag $.Values.api.appDbTopology.hostTemplates) }}
            {{- fail "api.appDbTopology.route needs tailnet, proxyClass, tag and hostTemplates together" }}
            {{- end }}
            # The API creates and deletes each paired app's management egress Service
            # (platform internal/dbroute). Turn on only after the app-db-routes release
            # (infra ADR 0064) gives it the Role and admission policies.
            - {name: PLATFORM_APP_DB_ROUTE_TAILNET, value: {{ .tailnet | quote }}}
            - {name: PLATFORM_APP_DB_ROUTE_PROXY_CLASS, value: {{ .proxyClass | quote }}}
            - {name: PLATFORM_APP_DB_ROUTE_TAG, value: {{ .tag | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.api.appFiles.enabled }}
            # Registered apps' files move with the platform identity through rclone
            # remotes eks: (S3 Pod Identity) and gke: (the Google ADC above). Turn on only
            # after the object IAM (ADR 0064) is applied.
            - {name: PLATFORM_APP_FILES, value: "1"}
            {{- end }}
            {{- if .Values.api.onboarding.enabled }}
            # /v1/onboardings, existing compose apps onboarding (platform ADR 0042).
            # Turn on only after infra ADR 0082's IAM, SSM documents, chart and
            # tailnet steps; the Tailscale OAuth client comes from SSM (settings.yaml).
            - {name: PLATFORM_ONBOARDING, value: "1"}
            {{- with .Values.api.onboarding.awsRegions }}
            # Regions discovery looks for the source VM in; the platform's default is
            # ap-northeast-2,ap-southeast-2, where terraform/platform/aws puts the documents.
            - {name: PLATFORM_ONBOARD_AWS_REGIONS, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- if .Values.hopai.enabled }}
            # POST /v1/ai-runs starts the AI runner from this Job template (hopai.yaml).
            - {name: PLATFORM_AIRUN_JOB_TEMPLATE, value: /etc/hopai/job.yaml}
            {{- end }}
            {{- with .Values.appDomain }}
            - {name: PLATFORM_APP_DOMAIN, value: {{ . | quote }}}
            {{- end }}
            {{- if $gcp.tokenAudience }}
            # The gcs storage driver uses Google ADC (infra ADR 0041).
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /etc/gcp/adc.json}
            {{- end }}
            {{- with .Values.github.appId }}
            # The private key and the webhook secret come from SSM (fetch-settings.sh).
            - {name: PLATFORM_GITHUB_APP_ID, value: {{ . | quote }}}
            - {name: PLATFORM_GITHUB_APP_PRIVATE_KEY_FILE, value: /config/github-app.pem}
            {{- end }}
            {{- with .Values.github.installationId }}
            - {name: PLATFORM_GITHUB_INSTALLATION_ID, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.deploy.builder }}
            {{- if not $.Values.github.appId }}
            {{- fail "deploy.builder needs github.appId" }}
            {{- end }}
            - {name: PLATFORM_DEPLOY_BUILDER, value: {{ . | quote }}}
            - {name: PLATFORM_IMAGE_REGISTRY, value: {{ required "deploy.imageRegistry is required with deploy.builder" $.Values.deploy.imageRegistry | quote }}}
            {{- if eq . "codebuild" }}
            - {name: PLATFORM_CODEBUILD_PROJECT, value: {{ required "deploy.codebuildProject is required with deploy.builder codebuild" $.Values.deploy.codebuildProject | quote }}}
            {{- if $gkeRegistry }}
            # Public AWS federation config for the build; the API's GCS ADC stays separate.
            - {name: PLATFORM_GKE_IMAGE_REGISTRY, value: {{ $gkeRegistry | quote }}}
            - {name: PLATFORM_GKE_IMAGE_CREDENTIAL_CONFIG, value: {{ toJson $gkeCredentials | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.deploy.backendTemplates }}
            {{- /* <env>=<template> entries (ADR 0058, platform PR #73). The API refuses a bad value at
            startup and would not come up, so a value that is not that shape fails rendering here. */}}
            {{- if not (regexMatch `^[a-z0-9-]+=https?://([a-z0-9.:/_?=&%-]|\{(app|instance|service|port|env)\})+(,[a-z0-9-]+=https?://([a-z0-9.:/_?=&%-]|\{(app|instance|service|port|env)\})+)*$` .) }}
            {{- fail "deploy.backendTemplates must be <env>=<http:// or https:// template> entries separated by commas, with only {app}, {instance}, {service}, {port} and {env} placeholders" }}
            {{- end }}
            # Gateway backend templates per environment; the others read their Service's load balancer.
            - {name: PLATFORM_APP_BACKEND_TEMPLATES, value: {{ . | quote }}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            {{- include "hopcharlie.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: settings, mountPath: /config, readOnly: true}
            {{- if (.Values.api.langfuse | default dict).enabled }}
            - {name: langfuse-config, mountPath: /etc/langfuse, readOnly: true}
            {{- range $app, $binding := .Values.api.langfuse.apps }}
            - {name: langfuse-auth-{{ $app | sha256sum | trunc 12 }}, mountPath: {{ printf "/var/run/langfuse/%s" $app | quote }}, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if (.Values.api.onpremRegistration | default dict).enabled }}
            - {name: onprem-profile, mountPath: /etc/onprem, readOnly: true}
            {{- end }}
            {{- with .Values.api.parity }}
            {{- if .enabled }}
            - {name: parity, mountPath: /etc/parity, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if .Values.hopai.enabled }}
            - {name: hopai-job, mountPath: /etc/hopai, readOnly: true}
            {{- end }}
            {{- if $gcp.tokenAudience }}
            - {name: gcp-token, mountPath: /var/run/secrets/gcp, readOnly: true}
            - {name: gcp-adc, mountPath: /etc/gcp, readOnly: true}
            {{- end }}
      volumes:
        {{- include "hopcharlie.settingsVolumes" . | nindent 8 }}
        {{- if (.Values.api.langfuse | default dict).enabled }}
        - name: langfuse-config
          configMap: {name: hopcharlie-langfuse-reader}
        {{- range $app, $binding := .Values.api.langfuse.apps }}
        - name: langfuse-auth-{{ $app | sha256sum | trunc 12 }}
          secret:
            secretName: {{ $binding.secretName | quote }}
            defaultMode: 0440
            items:
              - {key: public-key, path: public-key}
              - {key: secret-key, path: secret-key}
        {{- end }}
        {{- end }}
        {{- if (.Values.api.onpremRegistration | default dict).enabled }}
        - name: onprem-profile
          configMap: {name: hopcharlie-onprem-profile}
        {{- end }}
        {{- with .Values.api.parity }}
        {{- if .enabled }}
        - name: parity
          configMap:
            name: hopcharlie-parity
        {{- end }}
        {{- end }}
        {{- if .Values.hopai.enabled }}
        - name: hopai-job
          configMap:
            name: hopcharlie-hopai-job
        {{- end }}
        {{- if $gcp.tokenAudience }}
        # Only this pod gets a token for the Google audience; the gateway and
        # Postgres share the service account but not this token.
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $gcp.tokenAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        - name: gcp-adc
          configMap:
            name: hopcharlie-gcp-adc
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: hopcharlie-api-data
