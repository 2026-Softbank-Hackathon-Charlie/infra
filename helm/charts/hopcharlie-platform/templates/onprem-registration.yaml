{{- $cfg := .Values.api.onpremRegistration | default dict }}
{{- if $cfg.enabled }}
{{- if ne .Release.Namespace "charlie-platform" }}{{ fail "onprem registration requires charlie-platform namespace" }}{{ end }}
{{- if ne $cfg.tailnetDomain "tail567fe8.ts.net" }}{{ fail "onprem registration requires the approved tail567fe8.ts.net domain" }}{{ end }}
{{- if or (empty $cfg.profile) (ne ($cfg.profile.podSecurity | default "") "restricted") }}{{ fail "onprem registration requires a restricted profile" }}{{ end }}
{{- range $image := list $cfg.agentImage $cfg.tailscaleImage $cfg.helloImage }}
{{- if not (regexMatch `^[A-Za-z0-9./:_-]+@sha256:[a-f0-9]{64}$` $image) }}{{ fail "onprem registration images must be pinned by digest" }}{{ end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hopcharlie-platform-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-onprem-profile
data:
  profile.json: {{ toJson $cfg.profile | quote }}
---
# No get/list/watch: those rights would expose every existing Argo cluster credential.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hopcharlie-onprem-registration, namespace: argocd}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete]
  - apiGroups: [argoproj.io]
    resources: [appprojects, applicationsets]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hopcharlie-onprem-registration, namespace: argocd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hopcharlie-onprem-registration}
subjects: [{kind: ServiceAccount, name: hopcharlie-platform-api, namespace: charlie-platform}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hopcharlie-onprem-api-routes, namespace: hopcharlie-db-network}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hopcharlie-onprem-api-routes, namespace: hopcharlie-db-network}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hopcharlie-onprem-api-routes}
subjects: [{kind: ServiceAccount, name: hopcharlie-platform-api, namespace: charlie-platform}]
{{- range $binding := list (dict "name" "hopcharlie-platform-deployer" "namespace" "argocd") (dict "name" "hopcharlie-platform-app-db-routes" "namespace" "hopcharlie-db-network") }}
---
# The referenced existing Role remains owned by its existing release.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $binding.name }}-api
  namespace: {{ $binding.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $binding.name }}}
subjects: [{kind: ServiceAccount, name: hopcharlie-platform-api, namespace: charlie-platform}]
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: hopcharlie-onprem-secret}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: api-only
      expression: request.userInfo.username == 'system:serviceaccount:charlie-platform:hopcharlie-platform-api'
  variables:
    - name: obj
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: labels
      expression: "has(variables.obj.metadata.labels) ? variables.obj.metadata.labels : {}"
    - name: owner
      expression: "'hopcharlie.dev/onprem-enrollment' in variables.labels ? variables.labels['hopcharlie.dev/onprem-enrollment'] : ''"
    - name: annotations
      expression: "has(variables.obj.metadata.annotations) ? variables.obj.metadata.annotations : {}"
  validations:
    - expression: >-
        request.namespace == 'argocd' && variables.owner.matches('^enr_[a-f0-9]{24}$') &&
        variables.obj.metadata.name == 'hop-onprem-' + variables.owner.substring(4) &&
        'hopcharlie.dev/onprem-cluster-uid' in variables.labels &&
        variables.labels['hopcharlie.dev/onprem-cluster-uid'].matches('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$') &&
        'argocd.argoproj.io/secret-type' in variables.labels && variables.labels['argocd.argoproj.io/secret-type'] == 'cluster'
      message: API credentials must belong to the exact registration name, cluster UID and Argo cluster type
    - expression: >-
        request.operation != 'UPDATE' || (has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['hopcharlie.dev/onprem-enrollment'] == variables.owner &&
        oldObject.metadata.labels['hopcharlie.dev/onprem-cluster-uid'] == variables.labels['hopcharlie.dev/onprem-cluster-uid'])
      message: registration cannot adopt an existing foreign credential
    - expression: >-
        'hopcharlie.dev/registration-version' in variables.annotations &&
        variables.annotations['hopcharlie.dev/registration-version'].matches('^[1-9][0-9]{0,17}$') &&
        'hopcharlie.dev/token-expires-at' in variables.annotations &&
        variables.annotations['hopcharlie.dev/token-expires-at'].matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$') &&
        timestamp(variables.annotations['hopcharlie.dev/token-expires-at']) > timestamp('1970-01-01T00:00:00Z')
      message: registration credential requires a positive decimal version and valid UTC expiry
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.metadata.annotations) &&
        oldObject.metadata.annotations['hopcharlie.dev/registration-version'].matches('^[1-9][0-9]{0,17}$') &&
        (int(variables.annotations['hopcharlie.dev/registration-version']) > int(oldObject.metadata.annotations['hopcharlie.dev/registration-version']) ||
        (variables.annotations['hopcharlie.dev/registration-version'] == oldObject.metadata.annotations['hopcharlie.dev/registration-version'] && object.data['config'] == oldObject.data['config'])) &&
        timestamp(variables.annotations['hopcharlie.dev/token-expires-at']) >= timestamp(oldObject.metadata.annotations['hopcharlie.dev/token-expires-at']) &&
        object.data['server'] == oldObject.data['server'])
      message: rotation must advance registration version, preserve endpoint and never reduce expiry; equal version requires identical token config
    - expression: "request.operation == 'DELETE' || object.type == 'Opaque'"
      message: registration credential must have Opaque Secret type
    - expression: "request.operation == 'DELETE' || (has(object.data) && size(object.data) == 4)"
      message: registration credential requires exactly four data fields
    # The real API exposes core Secret.data as base64 strings. CEL has no
    # decoder here: the paired Go admission webhook parses the actual bytes
    # and enforces name/server/TLS/CA, without trusting parallel annotations.
    - expression: >-
        request.operation == 'DELETE' ||
        (['name','server','config','clusterResources'].all(k, k in object.data &&
        type(object.data[k]) == string && string(object.data[k]).matches('^[A-Za-z0-9+/]+={0,2}$')) &&
        object.data['clusterResources'] == '{{ "true" | b64enc }}' && size(object.data['config']) <= 65536)
      message: credential data must contain only the four encoded cluster fields; semantic validation is enforced by the fail-closed webhook

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: hopcharlie-onprem-secret}
spec: {policyName: hopcharlie-onprem-secret, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: hopcharlie-onprem-api-route}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [services]
  matchConditions:
    - name: api-only
      expression: request.userInfo.username == 'system:serviceaccount:charlie-platform:hopcharlie-platform-api'
  variables:
    - name: obj
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: labels
      expression: "has(variables.obj.metadata.labels) ? variables.obj.metadata.labels : {}"
    - name: owner
      expression: "'hopcharlie.dev/onprem-enrollment' in variables.labels ? variables.labels['hopcharlie.dev/onprem-enrollment'] : ''"
    - name: apiRoute
      expression: "variables.obj.metadata.name.startsWith('hop-k3s-')"
    - name: annotations
      expression: "has(variables.obj.metadata.annotations) ? variables.obj.metadata.annotations : {}"
  validations:
    - expression: >-
        request.namespace == 'hopcharlie-db-network' &&
        (variables.apiRoute ||
        (variables.obj.metadata.name.matches('^db-(eks|gke|onprem|legacy)-[a-z0-9][a-z0-9-]{0,40}$') &&
        'app.kubernetes.io/managed-by' in variables.labels && variables.labels['app.kubernetes.io/managed-by'] == 'hopcharlie-platform'))
      message: API changes only owned registration API routes or the existing platform-owned DB routes in their namespace
    - expression: >-
        variables.apiRoute || request.operation == 'DELETE' ||
        (object.spec.type == 'ExternalName' && object.spec.externalName == 'placeholder' && size(object.spec.ports) == 1 &&
        object.spec.ports[0].port == 5432 && object.spec.ports[0].protocol == 'TCP' &&
        variables.labels['hopcharlie.dev/db-route'] in ['eks','gke','onprem','legacy'] &&
        object.metadata.name.startsWith('db-' + variables.labels['hopcharlie.dev/db-route'] + '-') &&
        variables.labels['hopcharlie.dev/app'].matches('^[a-z0-9][a-z0-9-]{0,62}$') &&
        variables.annotations['tailscale.com/tags'] == 'tag:hop-db-client-management' &&
        variables.annotations['tailscale.com/proxy-class'] == 'hopcharlie-app-db-egress-management' &&
        variables.annotations['tailscale.com/tailnet-fqdn'] == 'hop-' + object.metadata.name + '.tail567fe8.ts.net' &&
        variables.annotations['tailscale.com/hostname'].matches('^hop-db-management-to-(eks|gke|onprem|legacy)-[a-z0-9-]+$') &&
        variables.annotations.all(k, !k.startsWith('tailscale.com/') || k in ['tailscale.com/tags','tailscale.com/proxy-class','tailscale.com/tailnet-fqdn','tailscale.com/hostname']))
      message: existing DB route creation must retain the reviewed TCP5432, tag and FQDN contract even before companion policy is installed
    # Existing CREATE/DELETE DB policies cover the other names. UPDATE was never
    # granted before this feature and remains prohibited for every other Service.
    - expression: "request.operation != 'UPDATE' || variables.apiRoute"
      message: API may update only its registration API route, never DB or existing static Services
    - expression: >-
        !variables.apiRoute || (request.namespace == 'hopcharlie-db-network' &&
        variables.owner.matches('^enr_[a-f0-9]{24}$') &&
        variables.obj.metadata.name == 'hop-k3s-' + variables.owner.substring(4) &&
        'hopcharlie.dev/onprem-cluster-uid' in variables.labels &&
        variables.labels['hopcharlie.dev/onprem-cluster-uid'].matches('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'))
      message: API route must match registration owner name and cluster UID
    - expression: >-
        !variables.apiRoute || request.operation != 'UPDATE' || (has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['hopcharlie.dev/onprem-enrollment'] == variables.owner &&
        oldObject.metadata.labels['hopcharlie.dev/onprem-cluster-uid'] == variables.labels['hopcharlie.dev/onprem-cluster-uid'] &&
        object.spec.externalName == oldObject.spec.externalName &&
        ((!has(object.metadata.finalizers) && !has(oldObject.metadata.finalizers)) ||
        (has(object.metadata.finalizers) && has(oldObject.metadata.finalizers) && object.metadata.finalizers == oldObject.metadata.finalizers)))
      message: update must preserve ownership, UID, operator externalName and finalizers
    - expression: >-
        !variables.apiRoute || request.operation == 'DELETE' ||
        (object.spec.type == 'ExternalName' && !has(object.spec.selector) && size(object.spec.ports) == 1 &&
        object.spec.ports[0].name == 'kubernetes' && object.spec.ports[0].port == 6443 && object.spec.ports[0].targetPort == 6443 &&
        object.spec.ports[0].protocol == 'TCP' &&
        object.metadata.annotations['tailscale.com/tailnet-fqdn'] == object.metadata.name + '.tail567fe8.ts.net' &&
        object.metadata.annotations['tailscale.com/proxy-class'] == 'hopcharlie-onprem-api-egress-management' &&
        object.metadata.annotations['tailscale.com/tags'] == 'tag:hop-onprem-api-client' &&
        object.metadata.annotations.all(k, !k.startsWith('tailscale.com/') || k in ['tailscale.com/tailnet-fqdn','tailscale.com/proxy-class','tailscale.com/tags']) &&
        (request.operation != 'CREATE' || object.spec.externalName == object.metadata.name + '.tail567fe8.ts.net'))
      message: API route exposes only approved tailnet device TCP6443 through its dedicated proxy class and tag
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: hopcharlie-onprem-api-route}
spec: {policyName: hopcharlie-onprem-api-route, validationActions: [Deny]}
{{- end }}
