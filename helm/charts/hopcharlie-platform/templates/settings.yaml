apiVersion: v1
kind: ServiceAccount
metadata:
  name: hopcharlie-platform
  labels:
    {{- include "hopcharlie.labels" "platform" | nindent 4 }}
# The IAM role comes from an EKS Pod Identity association on this
# ServiceAccount (terraform/platform/aws). It reads only the parameters under
# parameterPrefix and what the security view needs. Only the API pod mounts a
# Kubernetes token, and only with deploy.builder: the deploy executor asks
# Argo CD to refresh Applications (the Role is in helm/charts/hopcharlie-apps).
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-fetch-settings
  labels:
    {{- include "hopcharlie.labels" "platform" | nindent 4 }}
data:
  fetch-settings.sh: |
    # Copies one pod's settings from SSM Parameter Store into /config (an
    # in-memory volume), the way deploy/aws/host/sync.sh did on the EC2 host.
    # Secrets never go into Kubernetes Secrets or Git.
    #   FETCH=postgres  db-password
    #   FETCH=gateway   gateway.env
    #   FETCH=api       api.env, db-passwords.env, rclone.env, envs.yaml,
    #                   aiobs-clickhouse-password (with AIOBS_CLICKHOUSE),
    #                   kube/<cluster> (one kubeconfig per cluster),
    #                   sealed-secrets/<env>.pem (each cluster's Sealed Secrets
    #                   public certificate), and with GITHUB_APP_ID
    #                   github-app.pem and the webhook secret in api.env.
    #                   api.env also carries the console administrators
    #                   (platform-admins: name:bcrypt-hash,...) and, once it
    #                   exists, the app secrets key (app-secrets-key).
    set -euo pipefail
    umask 077

    get() { # one parameter, decrypted, without CR characters
      aws ssm get-parameter --with-decryption --name "$PREFIX/$1" \
        --query Parameter.Value --output text | tr -d '\r'
    }

    case "$FETCH" in
      postgres)
        get db-password > /config/db-password
        ;;
      gateway)
        token="$(get gateway-admin-token)"
        printf 'GATEWAY_ADMIN_TOKEN=%s\n' "$token" > /config/gateway.env
        ;;
      api)
        db="$(get db-password)"
        gw="$(get gateway-admin-token)"
        tokens="$(get platform-tokens)"
        admins="$(get platform-admins)"
        # The key app secrets are encrypted with (platform ADR 0019), empty
        # while the parameter does not exist: get-parameters lists a missing
        # name under InvalidParameters instead of failing, so access and
        # network errors still stop here. Without the key the API answers 503
        # to the secrets endpoints and deploys apps without secrets as before.
        secrets_key="$(aws ssm get-parameters --with-decryption --names "$PREFIX/app-secrets-key" \
          --query 'Parameters[].Value' --output text | tr -d '\r')"
        if [ "$secrets_key" = "None" ]; then secrets_key=""; fi
        # The password of the read-only ClickHouse user GET /v1/ai-activity uses
        # (scripts/put-clickhouse-read-password.sh, infra ADR 0077). A missing
        # parameter gives an empty file, so the API starts and the endpoint
        # answers 502 until the parameter exists.
        if [ -n "${AIOBS_CLICKHOUSE:-}" ]; then
          ch_pw="$(aws ssm get-parameters --with-decryption --names "$PREFIX/clickhouse-read-password" \
            --query 'Parameters[].Value' --output text | tr -d '\r')"
          if [ "$ch_pw" = "None" ]; then ch_pw=""; fi
          printf '%s' "$ch_pw" > /config/aiobs-clickhouse-password
        fi
        get db-passwords > /config/db-passwords.env
        get rclone-env > /config/rclone.env
        get host/envs.yaml > /config/envs.yaml
        if [ -n "${GITHUB_APP_ID:-}" ]; then
          get github-app-private-key > /config/github-app.pem
          webhook="$(get github-webhook-secret)"
        fi
        mkdir -p /config/kube
        files=""
        names="$(aws ssm get-parameters-by-path --path "$PREFIX/kube" \
          --query 'Parameters[].Name' --output text)"
        for name in $names; do
          [ "$name" = "None" ] && continue
          base="${name##*/}"
          case "$base" in
            *[!a-z0-9-]*|-*)
              echo "skipping $name: the last part must be lowercase letters, digits and '-'" >&2
              continue
              ;;
          esac
          get "kube/$base" > "/config/kube/$base"
          files="$files:/config/kube/$base"
        done
        # Public certificates the platform seals app keys and secrets with,
        # one String parameter per environment (scripts/put-sealed-secrets-cert.sh).
        names="$(aws ssm get-parameters-by-path --path "$PREFIX/sealed-secrets" \
          --query 'Parameters[].Name' --output text)"
        for name in $names; do
          [ "$name" = "None" ] && continue
          base="${name##*/}"
          case "$base" in
            *[!a-z0-9-]*|-*)
              echo "skipping $name: the last part must be lowercase letters, digits and '-'" >&2
              continue
              ;;
          esac
          mkdir -p /config/sealed-secrets
          get "sealed-secrets/$base" > "/config/sealed-secrets/$base.pem"
        done
        {
          printf 'PLATFORM_DATABASE_URL=postgres://charlie:%s@hopcharlie-postgres:5432/charlie?sslmode=disable\n' "$db"
          printf 'GATEWAY_TOKEN=%s\n' "$gw"
          printf 'PLATFORM_TOKENS=%s\n' "$tokens"
          printf 'PLATFORM_ADMINS=%s\n' "$admins"
          if [ -n "$secrets_key" ]; then printf 'PLATFORM_SECRETS_KEY=%s\n' "$secrets_key"; fi
          if [ -n "$files" ]; then printf 'KUBECONFIG=%s\n' "${files#:}"; fi
          if [ -n "${GITHUB_APP_ID:-}" ]; then printf 'PLATFORM_GITHUB_WEBHOOK_SECRET=%s\n' "$webhook"; fi
        } > /config/api.env
        ;;
      *)
        echo "unknown FETCH=$FETCH" >&2
        exit 1
        ;;
    esac
    echo "fetched settings for $FETCH"
