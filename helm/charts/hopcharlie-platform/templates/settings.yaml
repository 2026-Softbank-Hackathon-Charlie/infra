apiVersion: v1
kind: ServiceAccount
metadata:
  name: hopcharlie-platform
  labels:
    {{- include "hopcharlie.labels" "platform" | nindent 4 }}
# The IAM role comes from an EKS Pod Identity association on this
# ServiceAccount (terraform/platform/aws). It reads only the parameters under
# parameterPrefix and what the security view needs. Only the API pod mounts a
# Kubernetes token, and only with deploy.builder: the deploy executor asks
# Argo CD to refresh Applications (the Role is in helm/charts/hopcharlie-apps).
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-fetch-settings
  labels:
    {{- include "hopcharlie.labels" "platform" | nindent 4 }}
data:
  fetch-settings.sh: |
    # Copies one pod's settings from SSM Parameter Store into /config (an
    # in-memory volume), the way deploy/aws/host/sync.sh did on the EC2 host.
    # Secrets never go into Kubernetes Secrets or Git.
    #   FETCH=postgres  db-password
    #   FETCH=gateway   gateway.env
    #   FETCH=api       api.env, db-passwords.env, rclone.env, envs.yaml,
    #                   residency-policy.yaml (when host/residency-policy.yaml
    #                   exists, with its PLATFORM_RESIDENCY_POLICY_FILE line),
    #                   the Tailscale OAuth client of onboarding
    #                   (tailscale-onboard-oauth, when it exists) in api.env,
    #                   aiobs-clickhouse-password (with AIOBS_CLICKHOUSE),
    #                   kube/<cluster> (one kubeconfig per cluster),
    #                   sealed-secrets/<env>.pem (each cluster's Sealed Secrets
    #                   public certificate), and with GITHUB_APP_ID
    #                   github-app.pem and the webhook secret in api.env.
    #                   api.env also carries the console administrators
    #                   (platform-admins: name:bcrypt-hash,...) and, once it
    #                   exists, the app secrets key (app-secrets-key) and
    #                   the written record tokens (written-record-tokens).
    set -euo pipefail
    umask 077

    get() { # one parameter, decrypted, without CR characters
      aws ssm get-parameter --with-decryption --name "$PREFIX/$1" \
        --query Parameter.Value --output text | tr -d '\r'
    }

    case "$FETCH" in
      postgres)
        get db-password > /config/db-password
        ;;
      gateway)
        token="$(get gateway-admin-token)"
        printf 'GATEWAY_ADMIN_TOKEN=%s\n' "$token" > /config/gateway.env
        ;;
      api)
        db="$(get db-password)"
        gw="$(get gateway-admin-token)"
        tokens="$(get platform-tokens)"
        admins="$(get platform-admins)"
        # The key app secrets are encrypted with (platform ADR 0019), empty
        # while the parameter does not exist: get-parameters lists a missing
        # name under InvalidParameters instead of failing, so access and
        # network errors still stop here. Without the key the API answers 503
        # to the secrets endpoints and deploys apps without secrets as before.
        secrets_key="$(aws ssm get-parameters --with-decryption --names "$PREFIX/app-secrets-key" \
          --query 'Parameters[].Value' --output text | tr -d '\r')"
        if [ "$secrets_key" = "None" ]; then secrets_key=""; fi
        # The stream:token pairs apps append written records with (platform
        # ADR 0041, infra ADR 0079). Optional like the app secrets key:
        # without the parameter the API starts and refuses every
        # POST /v1/written-records, as before.
        written_tokens="$(aws ssm get-parameters --with-decryption --names "$PREFIX/written-record-tokens" \
          --query 'Parameters[].Value' --output text | tr -d '\r')"
        if [ "$written_tokens" = "None" ]; then written_tokens=""; fi
        # The password of the read-only ClickHouse user GET /v1/ai-activity uses
        # (scripts/put-clickhouse-read-password.sh, infra ADR 0077). A missing
        # parameter gives an empty file, so the API starts and the endpoint
        # answers 502 until the parameter exists.
        if [ -n "${AIOBS_CLICKHOUSE:-}" ]; then
          ch_pw="$(aws ssm get-parameters --with-decryption --names "$PREFIX/clickhouse-read-password" \
            --query 'Parameters[].Value' --output text | tr -d '\r')"
          if [ "$ch_pw" = "None" ]; then ch_pw=""; fi
          printf '%s' "$ch_pw" > /config/aiobs-clickhouse-password
        fi
        get db-passwords > /config/db-passwords.env
        get rclone-env > /config/rclone.env
        get host/envs.yaml > /config/envs.yaml
        # The residency policy (platform ADR 0013, infra ADR 0080), read like
        # app-secrets-key: without the parameter the API starts without the
        # residency gate, as before. With it, a start that breaks the policy
        # is refused. Parity is set from values instead (infra ADR 0076).
        residency="$(aws ssm get-parameters --with-decryption --names "$PREFIX/host/residency-policy.yaml" \
          --query 'Parameters[].Value' --output text | tr -d '\r')"
        if [ "$residency" = "None" ]; then residency=""; fi
        if [ -n "$residency" ]; then printf '%s\n' "$residency" > /config/residency-policy.yaml; fi
        # The Tailscale OAuth client onboarding mints the source's one-time
        # auth key with (platform ADR 0042, infra ADR 0082), JSON
        # {clientId, clientSecret} that the tailnet administrator puts there.
        # Optional: without it the API starts and onboarding cannot connect.
        ts_oauth="$(aws ssm get-parameters --with-decryption --names "$PREFIX/tailscale-onboard-oauth" \
          --query 'Parameters[].Value' --output text | tr -d '\r')"
        if [ "$ts_oauth" = "None" ]; then ts_oauth=""; fi
        # The image has no JSON tool; Tailscale client ids and secrets are
        # letters, digits, '-' and '_', so a strict match reads them. A value
        # that does not match is skipped with a message, like a missing one.
        ts_id=""; ts_secret=""
        if [ -n "$ts_oauth" ]; then
          flat="$(printf '%s' "$ts_oauth" | tr -d ' \t\n')"
          ts_id="$(printf '%s' "$flat" | sed -n 's/.*"clientId":"\([A-Za-z0-9_-]\{1,200\}\)".*/\1/p')"
          ts_secret="$(printf '%s' "$flat" | sed -n 's/.*"clientSecret":"\([A-Za-z0-9_-]\{1,200\}\)".*/\1/p')"
          if [ -z "$ts_id" ] || [ -z "$ts_secret" ]; then
            echo "skipping tailscale-onboard-oauth: it is not JSON {clientId, clientSecret}" >&2
            ts_id=""; ts_secret=""
          fi
        fi
        if [ -n "${GITHUB_APP_ID:-}" ]; then
          get github-app-private-key > /config/github-app.pem
          webhook="$(get github-webhook-secret)"
        fi
        mkdir -p /config/kube
        files=""
        names="$(aws ssm get-parameters-by-path --path "$PREFIX/kube" \
          --query 'Parameters[].Name' --output text)"
        for name in $names; do
          [ "$name" = "None" ] && continue
          base="${name##*/}"
          case "$base" in
            *[!a-z0-9-]*|-*)
              echo "skipping $name: the last part must be lowercase letters, digits and '-'" >&2
              continue
              ;;
          esac
          get "kube/$base" > "/config/kube/$base"
          files="$files:/config/kube/$base"
        done
        # Public certificates the platform seals app keys and secrets with,
        # one String parameter per environment (scripts/put-sealed-secrets-cert.sh).
        names="$(aws ssm get-parameters-by-path --path "$PREFIX/sealed-secrets" \
          --query 'Parameters[].Name' --output text)"
        for name in $names; do
          [ "$name" = "None" ] && continue
          base="${name##*/}"
          case "$base" in
            *[!a-z0-9-]*|-*)
              echo "skipping $name: the last part must be lowercase letters, digits and '-'" >&2
              continue
              ;;
          esac
          mkdir -p /config/sealed-secrets
          get "sealed-secrets/$base" > "/config/sealed-secrets/$base.pem"
        done
        {
          printf 'PLATFORM_DATABASE_URL=postgres://charlie:%s@hopcharlie-postgres:5432/charlie?sslmode=disable\n' "$db"
          printf 'GATEWAY_TOKEN=%s\n' "$gw"
          printf 'PLATFORM_TOKENS=%s\n' "$tokens"
          printf 'PLATFORM_ADMINS=%s\n' "$admins"
          if [ -n "$secrets_key" ]; then printf 'PLATFORM_SECRETS_KEY=%s\n' "$secrets_key"; fi
          if [ -n "$written_tokens" ]; then printf 'PLATFORM_WRITTEN_RECORD_TOKENS=%s\n' "$written_tokens"; fi
          if [ -n "$files" ]; then printf 'KUBECONFIG=%s\n' "${files#:}"; fi
          if [ -n "${GITHUB_APP_ID:-}" ]; then printf 'PLATFORM_GITHUB_WEBHOOK_SECRET=%s\n' "$webhook"; fi
          if [ -n "$residency" ]; then printf 'PLATFORM_RESIDENCY_POLICY_FILE=/config/residency-policy.yaml\n'; fi
          if [ -n "$ts_id" ]; then printf 'PLATFORM_TAILSCALE_OAUTH_CLIENT_ID=%s\nPLATFORM_TAILSCALE_OAUTH_CLIENT_SECRET=%s\n' "$ts_id" "$ts_secret"; fi
        } > /config/api.env
        if [ "${ONPREM_REGISTRATION:-0}" = 1 ]; then
          # Dedicated OAuth credential; never fall back to compose onboarding.
          registration_id=""; registration_secret=""
          if registration_oauth="$(get onprem-registration-oauth 2>/dev/null)"; then
            # Accept exactly the documented two-key JSON subset, in either
            # order. Strip no whitespace inside credentials and reject extras,
            # duplicate keys, escapes and trailing input. No JSON tool is in
            # this pinned image; Bash ERE captures the restricted ASCII values.
            registration_id_first=$'^[ \t\r\n]*[{][ \t\r\n]*"clientId"[ \t\r\n]*:[ \t\r\n]*"([A-Za-z0-9_-]{1,200})"[ \t\r\n]*,[ \t\r\n]*"clientSecret"[ \t\r\n]*:[ \t\r\n]*"([A-Za-z0-9_-]{1,200})"[ \t\r\n]*[}][ \t\r\n]*$'
            registration_secret_first=$'^[ \t\r\n]*[{][ \t\r\n]*"clientSecret"[ \t\r\n]*:[ \t\r\n]*"([A-Za-z0-9_-]{1,200})"[ \t\r\n]*,[ \t\r\n]*"clientId"[ \t\r\n]*:[ \t\r\n]*"([A-Za-z0-9_-]{1,200})"[ \t\r\n]*[}][ \t\r\n]*$'
            if [[ "$registration_oauth" =~ $registration_id_first ]]; then
              registration_id="${BASH_REMATCH[1]}"; registration_secret="${BASH_REMATCH[2]}"
            elif [[ "$registration_oauth" =~ $registration_secret_first ]]; then
              registration_secret="${BASH_REMATCH[1]}"; registration_id="${BASH_REMATCH[2]}"
            fi
          fi
          if [ -n "$registration_id" ] && [ -n "$registration_secret" ]; then
            printf 'PLATFORM_ONPREM_TAILSCALE_OAUTH_CLIENT_ID=%s\nPLATFORM_ONPREM_TAILSCALE_OAUTH_CLIENT_SECRET=%s\n' "$registration_id" "$registration_secret" >> /config/api.env
          else
            # Only registration becomes unavailable; existing API settings
            # and their required-parameter failure behavior stay unchanged.
            echo "onprem registration disabled: dedicated OAuth configuration unavailable or invalid" >&2
          fi
        fi
        ;;
      *)
        echo "unknown FETCH=$FETCH" >&2
        exit 1
        ;;
    esac
    echo "fetched settings for $FETCH"
