{{- /*
The AI runner (ai-sandbox hopai: AI plan, sandbox rehearsal, diagnosis) as a
Job the platform API starts from the console (POST /v1/ai-runs, platform
internal/airun). The API reads the Job template below from
PLATFORM_AIRUN_JOB_TEMPLATE and only fills in APP, FROM and TO.

An onboarding's contract PR (platform ADR 0042, infra ADR 0082) uses the same
template: the API sets KIND=onboard, ONBOARDING, REPO, BRANCH, FACTS_FILE and
CHECK_LOG_FILE in the hopai container, and in the volume onboarding the name
hopai-<onboarding id> with optional false. It then creates that ConfigMap
(facts.json, check.log) owned by the Job, so the pod waits for it and the
garbage collector deletes it with the Job. A plain run keeps the name
hopai-onboarding, which nobody creates, and mounts an empty optional volume.

A read-only recommendation sets KIND=recommend in both the init and main
containers. It fetches only the AI key and callback token, never kubeconfigs.
The Job metadata annotation is the platform's support handshake (ADR 0089).
The pinned hopai image must support the recommend command before activation.

The Job runs as its own ServiceAccount hopcharlie-hopai, whose Pod Identity
role (terraform/platform/aws eks.tf) reads only what fetch.sh gets, not the
platform role's (infra ADR 0082). It reads from SSM the Claude key, the sandbox-admin kubeconfigs of
the workload clusters (/hopcharlie/hopai/*, put there by an operator) and the
agent entry of /hopcharlie/platform-tokens. It talks to the API inside the
namespace, to the clusters' API servers and to Claude over 443.
*/ -}}
{{- if .Values.hopai.enabled }}
{{- $image := required "hopai.image is required with hopai.enabled" .Values.hopai.image }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hopcharlie-hopai
  labels:
    {{- include "hopcharlie.labels" "hopai" | nindent 4 }}
# Only an AWS identity (Pod Identity); hopai reaches the clusters with the
# kubeconfigs it fetches, never with a token of this account.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-hopai-fetch
  labels:
    {{- include "hopcharlie.labels" "hopai" | nindent 4 }}
data:
  fetch.sh: |
    # Copies the runner's settings from SSM Parameter Store into /config (an
    # in-memory volume). Values are never printed.
    set -euo pipefail
    umask 077
    get() { aws ssm get-parameter --with-decryption --name "$PREFIX/$1" --query Parameter.Value --output text | tr -d '\r'; }
    if [ "${KIND:-}" != recommend ]; then
      get hopai/kube-eks > /config/eks.yaml
      get hopai/kube-gke > /config/gke.yaml
    fi
    key="$(get hopai/anthropic-api-key)"
    # the first agent entry of name:role:token,... (the token may contain ':')
    tok="$(get platform-tokens | tr ',' '\n' | awk -F: '$2=="agent"{sub(/^[^:]*:[^:]*:/, ""); print; exit}')"
    [ -n "$tok" ] || { echo "no agent token in platform-tokens" >&2; exit 1; }
    printf 'ANTHROPIC_API_KEY=%s\nPLATFORM_TOKEN=%s\n' "$key" "$tok" > /config/hopai.env
    echo "fetched hopai settings"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopcharlie-hopai-job
  labels:
    {{- include "hopcharlie.labels" "hopai" | nindent 4 }}
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        hopcharlie.dev/recommendations: v1
      labels:
        {{- include "hopcharlie.labels" "hopai" | nindent 8 }}
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ if .Values.observability.automaticJobs }}{{ max 3600 (int .Values.hopai.keepFinishedSeconds) }}{{ else }}{{ .Values.hopai.keepFinishedSeconds }}{{ end }}
      activeDeadlineSeconds: {{ .Values.hopai.deadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "hopcharlie.labels" "hopai" | nindent 12 }}
            {{- if .Values.observability.automaticJobs }}
            observability.hopcharlie.dev/enabled: "true"
            observability.hopcharlie.dev/kind: job
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: hopcharlie-hopai
          automountServiceAccountToken: false
          securityContext:
            {{- include "hopcharlie.podSecurity" 10001 | nindent 12 }}
          initContainers:
            - name: fetch
              image: {{ .Values.images.awsCli | quote }}
              command: ["/bin/bash", "/scripts/fetch.sh"]
              env:
                - {name: AWS_REGION, value: {{ .Values.awsRegion | quote }}}
                - {name: PREFIX, value: {{ .Values.parameterPrefix | quote }}}
                - {name: HOME, value: /tmp}
              securityContext:
                {{- include "hopcharlie.containerSecurity" . | nindent 16 }}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 256Mi}
              volumeMounts:
                - {name: config, mountPath: /config}
                - {name: scripts, mountPath: /scripts, readOnly: true}
          containers:
            - name: hopai
              image: {{ $image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  while IFS= read -r line || [ -n "$line" ]; do case "$line" in *=*) export "$line";; esac; done < /config/hopai.env
                  # Facts and callback metadata are injected by the platform.
                  # This branch never invokes a cluster or starts a migration.
                  if [ "${KIND:-}" = recommend ]; then exec hopai recommend; fi
                  # The contract PR of an onboarding: hopai reads ONBOARDING, REPO,
                  # BRANCH, FACTS_FILE and CHECK_LOG_FILE (/onboarding) itself.
                  if [ "${KIND:-}" = onboard ]; then exec hopai onboard; fi
                  exec hopai run -app "$APP" -from "$FROM" -to "$TO" \
                    -env gke=/config/gke.yaml -env eks=/config/eks.yaml \
                    -sandbox-kubeconfig "/config/$TO.yaml" \
                    -max-runs {{ .Values.hopai.maxRuns }} -out /work/report.json
              env:
                - {name: PLATFORM_URL, value: "http://hopcharlie-api:8080"}
                - {name: HOME, value: /work}
                {{- if .Values.hopai.langfuse.enabled }}
                - {name: LANGFUSE_BASE_URL, value: {{ .Values.hopai.langfuse.baseURL | quote }}}
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef: {name: hopcharlie-langfuse-auth, key: public-key}
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef: {name: hopcharlie-langfuse-auth, key: secret-key}
                - name: HOPCHARLIE_RUN_ID
                  valueFrom:
                    fieldRef: {apiVersion: v1, fieldPath: "metadata.labels['job-name']"}
                {{- end }}
              securityContext:
                {{- include "hopcharlie.containerSecurity" . | nindent 16 }}
              resources:
                requests: {cpu: 200m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: onboarding, mountPath: /onboarding, readOnly: true}
          volumes:
            - name: config
              emptyDir: {medium: Memory, sizeLimit: 8Mi}
            - name: work
              emptyDir: {sizeLimit: 256Mi}
            - name: scripts
              configMap: {name: hopcharlie-hopai-fetch}
            - name: onboarding
              configMap: {name: hopai-onboarding, optional: true}
---
# The API creates the runner's Jobs and reads their status, in this
# namespace only. It cannot create Pods directly or change other Jobs' specs.
# An onboarding's Job also gets a ConfigMap of its input, and DELETE of an
# onboarding stops its Job; the AI runner policy (hopcharlie-apps) limits
# both to hopai-onb-* ConfigMaps and the runner's Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hopcharlie-ai-runner
  labels:
    {{- include "hopcharlie.labels" "hopai" | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete]
  # The result of an onboarding's hopai run is its pod's log (platform #139).
  # RBAC cannot narrow pods to the runner's, so this reads every pod spec and
  # log in this namespace; the platform's settings are in /config, not in
  # pod specs or logs.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hopcharlie-ai-runner
  labels:
    {{- include "hopcharlie.labels" "hopai" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hopcharlie-ai-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "hopcharlie.apiServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
