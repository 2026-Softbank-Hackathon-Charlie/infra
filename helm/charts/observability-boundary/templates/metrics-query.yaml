{{- if and .Values.enabled .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: {name: observability-metrics-query}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/query/tls/tls.crt;
        ssl_certificate_key /etc/query/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        client_max_body_size 1m;
        location = /healthz { return 200; }
        location ~ ^/api/v1/(query|query_range|query_exemplars|labels|metadata|series|label/[a-zA-Z_:][a-zA-Z0-9_:]*/values)$ {
          if ($request_method !~ ^(GET|POST)$) { return 405; }
          auth_basic "metrics";
          auth_basic_user_file /etc/query/auth/htpasswd;
          proxy_set_header Authorization "";
          proxy_set_header Cookie "";
          proxy_connect_timeout 3s;
          proxy_read_timeout 20s;
          proxy_pass http://monitoring-prometheus.observability.svc:9090;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: observability-metrics-query}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: observability-metrics-query}}
  template:
    metadata: {labels: {app.kubernetes.io/name: observability-metrics-query}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101}
      containers:
        - name: query
          image: {{ .Values.metrics.image | quote }}
          command: [nginx, -g, "daemon off;"]
          ports: [{name: https, containerPort: 8443}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          readinessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, initialDelaySeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /etc/query/tls, readOnly: true}
            - {name: auth, mountPath: /etc/query/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: observability-metrics-query}}
        - {name: tls, secret: {secretName: {{ .Values.metrics.tlsSecret | quote }}}}
        - {name: auth, secret: {secretName: {{ .Values.metrics.authSecret | quote }}}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: observability-metrics-query
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," .Values.metrics.privateSubnets | quote }}
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    {{- toYaml .Values.metrics.sourceRanges | nindent 4 }}
  selector: {app.kubernetes.io/name: observability-metrics-query}
  ports: [{name: https, port: 443, targetPort: https}]
{{- end }}
