{{- if and .Values.enabled (default false .Values.awsPlatformMetrics) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: monitoring-aws-platform-metrics}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: monitoring-aws-platform-metrics}
subjects:
  - {kind: ServiceAccount, name: monitoring-prometheus, namespace: observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: monitoring-aws-platform-metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: monitoring-aws-kube-state-metrics}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, persistentvolumes, persistentvolumeclaims, services]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: monitoring-aws-kube-state-metrics}
subjects:
  - {kind: ServiceAccount, name: monitoring-kube-state-metrics, namespace: observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: monitoring-aws-kube-state-metrics}
{{- end }}
