{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: observability-gateway-ingress}
spec:
  podSelector:
    matchLabels: {observability.hopcharlie.dev/gateway: "true"}
  policyTypes: [Ingress, Egress]
  # Preserve existing gateway upstream/API/DNS egress; only ingress is narrowed.
  egress: [{}]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [alloy, opentelemetry-collector]}
      ports: [{protocol: TCP, port: 4318}]
    - from:
        - namespaceSelector:
            matchLabels: {observability.hopcharlie.dev/enabled: "true"}
          podSelector:
            matchLabels: {observability.hopcharlie.dev/enabled: "true", observability.hopcharlie.dev/kind: application}
      ports: [{protocol: TCP, port: 4319}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 8888}, {protocol: TCP, port: 13133}]
{{- end }}
