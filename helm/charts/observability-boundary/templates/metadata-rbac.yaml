{{- if .Values.enabled }}
{{- range $name := list "observability-agent" "observability-gateway" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ $name }}-metadata}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ $name }}-metadata}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-metadata}
{{- end }}
{{- end }}
