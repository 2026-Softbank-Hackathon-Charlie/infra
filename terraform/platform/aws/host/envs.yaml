# Environments the platform API reports on (GET /v1/envs, charlie env list).
# Point PLATFORM_ENVS_FILE at this file.
#
#   name            id used in URLs and plans, ^[a-z0-9-]+$
#   provider        aws | gcp | onprem
#   displayName     optional, defaults to name
#   region          optional
#   kubeContext     required, the kubeconfig context of the cluster
#   kubeconfig      optional path; default loading rules ($KUBECONFIG, ~/.kube/config) otherwise
#   gatewayBackend  optional, the traffic gateway backend for this environment; defaults to name
#   sealedSecretsCert  optional, the cluster's Sealed Secrets public certificate; apps with
#                      secrets or an s3 resource deploy only where it is set (platform ADR 0019)
#   storage         optional, the driver that makes app buckets and keys (platform ADR 0016);
#                   apps with an s3 resource register only where it is set. For driver aws,
#                   Terraform fills in the bucket prefix, IAM path and boundary that
#                   app-storage.tf lets the platform pod role use (templatefile in main.tf).
environments:
  - name: gke
    provider: gcp
    displayName: GCP GKE
    region: asia-northeast3
    kubeContext: gke-hopcharlie
    sealedSecretsCert: /config/sealed-secrets/gke.pem
    storage:
      driver: gcs
      project: project-b47cdba3-db5b-42a2-9a6
      bucketPrefix: hopcharlie-gke-
      region: asia-northeast3
  - name: eks
    provider: aws
    displayName: AWS EKS
    region: ap-northeast-2
    kubeContext: eks-hopcharlie
    sealedSecretsCert: /config/sealed-secrets/eks.pem
    storage:
      driver: aws
      bucketPrefix: ${app_bucket_prefix}
      region: ap-northeast-2
      iamPath: ${app_iam_path}
      permissionsBoundary: ${app_boundary_arn}
  - name: onprem
    provider: onprem
    displayName: On-prem k3s (laptop GPU)
    region: laptop
    kubeContext: onprem-hopcharlie
    sealedSecretsCert: /config/sealed-secrets/onprem.pem
    # The laptop's MinIO (infra ADR 0081), reached from the management EKS
    # through the Tailscale egress Service minio-onprem (port 80 -> 9000).
    # Driver minio is only in the platform's minio image flavor (platform ADR
    # 0016/0045): pin that image before this block reaches SSM, or the API
    # refuses PLATFORM_ENVS_FILE and stops. The admin key is the MinIO root
    # key in SSM rclone-env (ONPREM_MINIO_ADMIN_*).
    storage:
      driver: minio
      bucketPrefix: hopcharlie-op-
      region: us-east-1
      endpoint: http://minio-onprem.hopcharlie-db-network.svc.cluster.local
      adminAccessKeyEnv: ONPREM_MINIO_ADMIN_ACCESS_KEY
      adminSecretKeyEnv: ONPREM_MINIO_ADMIN_SECRET_KEY
