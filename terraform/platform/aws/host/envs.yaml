# Environments the platform API reports on (GET /v1/envs, charlie env list).
# Point PLATFORM_ENVS_FILE at this file.
#
#   name            id used in URLs and plans, ^[a-z0-9-]+$
#   provider        aws | gcp | onprem
#   displayName     optional, defaults to name
#   region          optional
#   kubeContext     required, the kubeconfig context of the cluster
#   kubeconfig      optional path; default loading rules ($KUBECONFIG, ~/.kube/config) otherwise
#   gatewayBackend  optional, the traffic gateway backend for this environment; defaults to name
#   sealedSecretsCert  optional, the cluster's Sealed Secrets public certificate; apps with
#                      secrets or an s3 resource deploy only where it is set (platform ADR 0019)
#   storage         optional, the driver that makes app buckets and keys (platform ADR 0016);
#                   apps with an s3 resource register only where it is set. For driver aws the
#                   bucket prefix, IAM path and boundary are the ones terraform/platform/aws
#                   (app-storage.tf) lets the platform pod role use.
environments:
  - name: gke
    provider: gcp
    displayName: GCP GKE
    region: asia-northeast3
    kubeContext: gke-hopcharlie
  - name: eks
    provider: aws
    displayName: AWS EKS
    region: ap-northeast-2
    kubeContext: eks-hopcharlie
    sealedSecretsCert: /config/sealed-secrets/eks.pem
    storage:
      driver: aws
      bucketPrefix: hopcharlie-eks-
      region: ap-northeast-2
      iamPath: /hopcharlie-apps/
      permissionsBoundary: arn:aws:iam::525091405886:policy/hopcharlie-app-boundary
  - name: onprem
    provider: onprem
    displayName: On-prem k3s
    region: team server
    kubeContext: onprem-hopcharlie
