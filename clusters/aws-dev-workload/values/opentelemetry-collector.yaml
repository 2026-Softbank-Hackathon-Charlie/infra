{
  "mode": "daemonset",
  "fullnameOverride": "observability-agent",
  "image": {
    "repository": "docker.io/otel/opentelemetry-collector-contrib",
    "tag": "0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1"
  },
  "command": {
    "name": "otelcol-contrib"
  },
  "resources": {
    "requests": {
      "cpu": "100m",
      "memory": "128Mi"
    },
    "limits": {
      "memory": "512Mi"
    }
  },
  "presets": {
    "logsCollection": {
      "enabled": true,
      "storeCheckpoints": true
    },
    "kubernetesAttributes": {
      "enabled": true
    }
  },
  "service": {
    "enabled": false
  },
  "ports": {
    "otlp": {
      "enabled": false
    },
    "otlp-http": {
      "enabled": false
    },
    "jaeger-compact": {
      "enabled": false
    },
    "jaeger-thrift": {
      "enabled": false
    },
    "jaeger-grpc": {
      "enabled": false
    },
    "zipkin": {
      "enabled": false
    },
    "metrics": {
      "enabled": false
    }
  },
  "extraEnvsFrom": [
    {
      "secretRef": {
        "name": "observability-client-auth"
      }
    }
  ],
  "extraVolumes": [
    {
      "name": "client-ca",
      "secret": {
        "secretName": "observability-client-ca"
      }
    }
  ],
  "extraVolumeMounts": [
    {
      "name": "client-ca",
      "mountPath": "/etc/otel/client",
      "readOnly": true
    }
  ],
  "config": {
    "extensions": {
      "file_storage/queue": {
        "directory": "/var/lib/otelcol/queue",
        "create_directory": true
      }
    },
    "receivers": {
      "otlp": null,
      "jaeger": null,
      "zipkin": null,
      "prometheus": null,
      "filelog": {
        "include": [
          "/var/log/pods/charlie-apps_*/*/*.log"
        ],
        "exclude": [
          "/var/log/pods/observability_*/*/*.log"
        ],
        "start_at": "end"
      }
    },
    "processors": {
      "resource/cluster": {
        "attributes": [
          {
            "key": "cloud.provider",
            "value": "aws",
            "action": "upsert"
          },
          {
            "key": "cloud.region",
            "value": "ap-northeast-2",
            "action": "upsert"
          },
          {
            "key": "k8s.cluster.name",
            "value": "charlie-dev-workload",
            "action": "upsert"
          },
          {
            "key": "deployment.environment.name",
            "value": "dev",
            "action": "upsert"
          }
        ]
      },
      "attributes/redact": {
        "actions": [
          {
            "key": "authorization",
            "action": "delete"
          },
          {
            "key": "http.request.header.authorization",
            "action": "delete"
          },
          {
            "key": "http.request.header.cookie",
            "action": "delete"
          },
          {
            "key": "password",
            "action": "delete"
          },
          {
            "key": "token",
            "action": "delete"
          }
        ]
      },
      "batch": {
        "send_batch_size": 512,
        "send_batch_max_size": 1024,
        "timeout": "1s"
      },
      "filter/sensitive": {
        "error_mode": "propagate",
        "logs": {
          "log_record": [
            "IsString(body) and IsMatch(body, \"(?i)(password|authorization|access_token|refresh_token|cookie)[\\\" ]*[:=]\")"
          ]
        }
      }
    },
    "exporters": {
      "debug": null,
      "otlphttp/central": {
        "endpoint": "https://observability-gateway.observability.svc:4318",
        "headers": {
          "Authorization": "Bearer ${env:OTLP_AUTH_TOKEN}"
        },
        "tls": {
          "ca_file": "/etc/otel/client/ca.crt"
        },
        "sending_queue": {
          "enabled": true,
          "queue_size": 1000,
          "storage": "file_storage/queue"
        },
        "retry_on_failure": {
          "enabled": true,
          "max_elapsed_time": "0s"
        }
      }
    },
    "service": {
      "extensions": [
        "health_check",
        "file_storage",
        "file_storage/queue"
      ],
      "pipelines": {
        "logs": {
          "receivers": [
            "filelog"
          ],
          "processors": [
            "memory_limiter",
            "k8sattributes",
            "resource/cluster",
            "attributes/redact",
            "filter/sensitive",
            "batch"
          ],
          "exporters": [
            "otlphttp/central"
          ]
        },
        "traces": null,
        "metrics": null
      }
    }
  },
  "rewriteDeprecatedComponentNames": false,
  "securityContext": {
    "runAsUser": 0,
    "runAsGroup": 0,
    "allowPrivilegeEscalation": false,
    "readOnlyRootFilesystem": true,
    "capabilities": {
      "drop": [
        "ALL"
      ]
    }
  }
}
