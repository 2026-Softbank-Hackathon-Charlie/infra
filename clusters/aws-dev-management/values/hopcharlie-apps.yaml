{
  "environments": {
    "eks": {
      "cluster": {},
      "profile": {
        "publicService": {
          "type": "LoadBalancer",
          "port": 80,
          "annotations": {
            "service.beta.kubernetes.io/aws-load-balancer-type": "external",
            "service.beta.kubernetes.io/aws-load-balancer-scheme": "internal",
            "service.beta.kubernetes.io/aws-load-balancer-nlb-target-type": "ip"
          }
        },
        "progressDeadlineSeconds": 300,
        "postgres": {
          "storageClass": "gp3",
          "storageSize": "1Gi",
          "resources": {
            "requests": {"memory": "256Mi"},
            "limits": {"memory": "512Mi"}
          }
        },
        "s3": {
          "endpoint": "https://s3.ap-northeast-2.amazonaws.com",
          "region": "ap-northeast-2",
          "bucketPrefix": "hopcharlie-eks-",
          "credentialsSecret": "app-s3"
        },
        "quota": {
          "enabled": true,
          "hard": {
            "requests.cpu": "2",
            "requests.memory": "4Gi",
            "limits.memory": "8Gi",
            "pods": "20",
            "persistentvolumeclaims": "4",
            "requests.storage": "20Gi",
            "services.loadbalancers": "1"
          }
        },
        "limitRange": {
          "enabled": true,
          "default": {"memory": "256Mi"},
          "defaultRequest": {"cpu": "50m", "memory": "64Mi"}
        },
        "networkPolicy": {
          "enabled": true,
          "gatewayFrom": [
            {"ipBlock": {"cidr": "10.40.0.0/16"}}
          ]
        }
      }
    },
    "gke": {
      "cluster": {"name": "charlie-dev-gcp-workload"},
      "profile": {
        "publicService": {
          "type": "LoadBalancer",
          "port": 80,
          "annotations": {
            "networking.gke.io/load-balancer-type": "Internal"
          },
          "externalTrafficPolicy": "Local"
        },
        "progressDeadlineSeconds": 300,
        "postgres": {
          "storageClass": "charlie-gcp-balanced",
          "storageSize": "1Gi",
          "resources": {
            "requests": {"memory": "256Mi"},
            "limits": {"memory": "512Mi"}
          }
        },
        "s3": {
          "endpoint": "https://storage.googleapis.com",
          "region": "auto",
          "bucketPrefix": "hopcharlie-gke-",
          "credentialsSecret": "app-s3"
        },
        "quota": {
          "enabled": true,
          "hard": {
            "requests.cpu": "2",
            "requests.memory": "4Gi",
            "limits.memory": "8Gi",
            "pods": "20",
            "persistentvolumeclaims": "4",
            "requests.storage": "20Gi",
            "services.loadbalancers": "1"
          }
        },
        "limitRange": {
          "enabled": true,
          "default": {"memory": "256Mi"},
          "defaultRequest": {"cpu": "50m", "memory": "64Mi"}
        },
        "networkPolicy": {
          "enabled": true,
          "gatewayFrom": [
            {"ipBlock": {"cidr": "10.40.0.0/19"}}
          ]
        }
      }
    }
  },
  "platform": {
    "aiRunner": {
      "enabled": true,
      "imagePrefixes": [
        "525091405886.dkr.ecr.ap-northeast-2.amazonaws.com/hopcharlie/hopai:",
        "public.ecr.aws/aws-cli/aws-cli:"
      ]
    }
  }
}
