name: Onprem registration admission
on:
  pull_request:
    paths:
      - helm/charts/hopcharlie-platform/**
      - helm/charts/hopcharlie-apps/**
      - helm/charts/hopcharlie-db-network/**
      - scripts/test-onprem-admission.py
      - scripts/tests/test-onprem-registration.py
      - .github/workflows/onprem-admission.yml
permissions: {contents: read}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      # Draft integration reference only; pin the reviewed stable platform
      # commit before release. No module or deployed image uses this PR ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: 2026-Softbank-Hackathon-Charlie/platform
          ref: e8cbcb1456d0d5fa0594798153f2cdd34cf788c4
          path: .contract-platform
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .contract-platform/go.mod
          cache-dependency-path: .contract-platform/go.sum
      - name: Compile the real platform admission validator
        working-directory: .contract-platform
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          go build -o "$RUNNER_TEMP/onprem-admission-webhook" ./test/onprem-admission-webhook
      - uses: azure/setup-helm@v4.3.1
        with: {version: v3.19.1}
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Check fixture syntax and chart contracts before provisioning
        run: python3 scripts/test-onprem-admission.py --render-only
      - name: Install verified kind binary
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create disposable API server (no cloud credentials)
        run: kind create cluster --name onprem-admission --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
      - name: Verify rendered RBAC and CEL with real API admission
        env:
          ONPREM_ADMISSION_FIXTURE: '1'
          ONPREM_WEBHOOK_BINARY: ${{ runner.temp }}/onprem-admission-webhook
        run: python3 scripts/test-onprem-admission.py
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name onprem-admission
