name: HopCharlie platform Terraform validation

on:
  pull_request:
    paths:
      - 'terraform/platform/aws/**'
      - 'scripts/check-platform-terraform.py'
      - 'scripts/test-platform-terraform.py'
      - '.github/workflows/platform-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/platform/aws/**'
      - 'scripts/check-platform-terraform.py'
      - 'scripts/test-platform-terraform.py'
      - '.github/workflows/platform-terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, hopcharlie]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Verify clean-copy and isolated command contract
        run: python3 scripts/test-platform-terraform.py
      - name: Format, backend-disabled initialization and validation of host, state and DNS roots
        run: python3 scripts/check-platform-terraform.py
