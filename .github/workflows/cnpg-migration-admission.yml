name: CNPG migration admission
on:
  pull_request:
    paths:
      - clusters/*-dev-workload/hopcharlie-platform-access.yaml
      - scripts/test-cnpg-migration-admission.py
      - .github/workflows/cnpg-migration-admission.yml
permissions: {contents: read}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Check policy parity before provisioning
        run: python3 scripts/test-cnpg-migration-admission.py --check-only
      - name: Install verified kind binary
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create disposable API server (no cloud credentials or DB)
        run: kind create cluster --name cnpg-migration-admission --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
      - name: Verify exact engine patches and forbidden mutations
        env: {CNPG_MIGRATION_ADMISSION_FIXTURE: '1'}
        run: python3 scripts/test-cnpg-migration-admission.py
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name cnpg-migration-admission
