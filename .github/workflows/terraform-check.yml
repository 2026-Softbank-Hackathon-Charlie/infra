name: Charlie infrastructure
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      apply:
        description: 'main의 검증된 Terraform 구성을 실제 AWS에 적용'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned Terraform version
        id: tf-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.1
      - run: python3 -m pip install PyYAML==6.0.3
      - run: make check
  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: charlie-terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
      TF_VAR_operator_principal_arn: ${{ vars.EKS_OPERATOR_PRINCIPAL_ARN }}
      TF_VAR_additional_operator_principal_arns: ${{ vars.EKS_ADDITIONAL_OPERATOR_PRINCIPAL_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment settings
        shell: bash
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_ACCOUNT_ID" != 000000000000 ]]
          [[ -n "$AWS_REGION" && -n "$TF_STATE_BUCKET" ]]
          [[ "$TF_STATE_BUCKET" == "charlie-tfstate-$AWS_ACCOUNT_ID-$AWS_REGION" ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/charlie-dev-github-terraform" ]]
      - name: Read pinned Terraform version
        id: tf-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: charlie-terraform-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - run: bash scripts/tf-ci.sh apply
